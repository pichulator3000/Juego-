    var isSpy = e.spyIndexes.indexOf(e.order[e.step]) !== -1;
    var passGlow = '<div class="turn-glow">Pásale el teléfono a <span class="turn-glow-name">' + esc(player.name) + '</span></div>';
    var backFace = isSpy
      ? '<div class="face face-back cat-espia-spy">' + passGlow + '<span class="cat-badge">Impostor</span><div class="cat-emoji">🎭</div><div class="challenge-text">Eres el Impostor</div><div class="challenge-sub">No conoces la palabra. Disimula y trata de descubrirla sin que te pillen.</div></div>'
      : '<div class="face face-back cat-espia-word">' + passGlow + '<span class="cat-badge">Palabra secreta</span><div class="cat-emoji">🔎</div><div class="challenge-text">' + esc(e.word) + '</div><div class="challenge-sub">No la digas en voz alta. El Impostor no la sabe.</div></div>';

    return (
      '<div class="stage-wrap">' +
        '<button class="tap-target" data-action="reveal-espia" aria-label="Toca cuando tengas el teléfono">' +
          '<div class="flip-card ' + (e.revealed ? 'flipped' : '') + '">' +
            '<div class="face face-front">' +
              passGlow +
              '<div class="mark">🤫</div>' +
              '<div class="tap-hint">Toca cuando tengas el teléfono en tus manos</div>' +
            '</div>' +
            backFace +
          '</div>' +
        '</button>' +

        '<div class="play-actions ' + (e.revealed ? '' : 'hidden') + '">' +
          '<button class="btn-primary" data-action="next-espia-step">Listo, pasar el teléfono</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderPlay(){
    var current = state.players[state.turn];
    var turnGlowHtml = '<div class="turn-glow"><span class="turn-glow-name">' + esc(current.name) + '</span></div>';

    // Modo Cultura No General: rail con vidas
    var rail = state.players.map(function(p, i){
      var lifeHtml = '';
      if (state.selectedMode === 'cultura' && state.playerLives && state.playerLives[i] !== undefined){
        var life = state.playerLives[i];
        var eliminated = state.culturaEliminated && state.culturaEliminated[i];
        lifeHtml = '<div class="player-life ' + (eliminated ? 'eliminated' : '') + '" style="margin-top:4px;">' +
          '<span class="life-heart">❤️</span>' +
          '<span class="life-value">' + (eliminated ? 'ELIMINADO' : life) + '</span>' +
        '</div>';
      }
      return '<div class="rail-player ' + (i === state.turn ? 'current' : '') + (state.culturaEliminated && state.culturaEliminated[i] ? ' eliminated' : '') + '">' +
        '<span class="avatar" style="background:' + p.color + '">' + esc(initials(p.name)) + '</span>' +
        '<small>' + esc(p.name) + '</small>' +
        lifeHtml +
        '</div>';
    }).join('');

    var topbar =
      '<div class="topbar">' +
        '<button class="icon-btn" data-action="back-setup" aria-label="Volver a modos">‹</button>' +
        '<span class="round-badge">' + (state.selectedMode === 'cultura' ? 'Ronda ' + state.round : 'Turno ' + state.round) + '</span>' +
        '<span class="mode-flags">' +
          (state.selectedMode !== 'cultura' ? (
            '<span class="' + (state.futbol ? 'on' : '') + '" title="Modo fútbol">⚽</span>' +
            '<span class="' + (state.disco ? 'on' : '') + '" title="Modo disco">🪩</span>' +
            '<span class="' + (state.cards === 'si' ? 'on' : '') + '" title="Con cartas">🃏</span>'
          ) : '<span class="on" title="Modo Cultura No General">🧠</span>') +
        '</span>' +
      '</div>';

    if (state.espia){
      app.innerHTML = topbar + renderEspiaStage();
      return;
    }

    if (state.selectedMode === 'pasapalabra'){
      app.innerHTML = topbar + '<div class="rail">' + rail + '</div>' + renderPasapalabraStage();
      return;
    }

    // Modo Cultura No General: lógica de eliminación (AHORA después de definir turnGlowHtml, topbar, rail)
    if (state.selectedMode === 'cultura'){
      renderCulturaElimination(turnGlowHtml, topbar, rail);
      return;
    }

    var backFace = '';
    var actionsHtml = '';
    if (state.card && state.card.special === 'word-drop'){
      var meta = DECK[state.card.cat];
      var wd = state.wordDrop;
      var wdBody, badgeText;
      if (!wd){
        badgeText = meta.label;
        wdBody = '<div class="challenge-text">' + esc(state.card.text) + '</div>' +
          '<div class="challenge-sub">Primero ronda de Lugares, después ronda de Personas. 5 palabras cada una, una cada 5 segundos. Toca "Comenzar" cuando estén listos.</div>';
        actionsHtml = '<button class="btn-primary" data-action="start-word-drop">Comenzar</button>';
      } else if (wd.phase === 'countdown'){
        badgeText = 'Ronda: ' + wd.words[0].round;
        wdBody = '<div class="countdown-number">' + wd.countdown + '</div>';
        actionsHtml = '';
      } else if (wd.phase === 'playing'){
        badgeText = 'Ronda: ' + wd.words[wd.index].round;
        wdBody = (wd.words[wd.index].double ? '<div class="double-tag">¡doble!</div>' : '') +
          '<div class="word-drop-word">' + esc(wd.words[wd.index].word) + '</div>' +
          '<div class="challenge-sub">' + (wd.index + 1) + ' / ' + wd.words.length + '</div>';
        actionsHtml = '';
      } else {
        badgeText = meta.label;
        wdBody = '<div class="challenge-text">¡Listo!</div>' +
          '<div class="challenge-sub">' + discoDouble(1) + ' trago por cada una que te haya tocado.</div>';
        actionsHtml = '<button class="btn-primary" data-action="next-turn">Listo, siguiente turno</button>';
      }
      backFace = '<div class="face face-back ' + meta.cls + '">' + turnGlowHtml + '<span class="cat-badge">' + esc(badgeText) + '</span>' + wdBody + '</div>';
    } else if (state.card && state.card.special === 'naming-challenge'){
      var meta = DECK[state.card.cat];
      var n = state.naming;
      var nBody, nBadge;
      if (!n){
        nBadge = meta.label;
        nBody = '<div class="challenge-text">' + esc(state.card.text) + '</div>' +
          '<div class="challenge-sub">Toca "Comenzar" y vas a tener 30 segundos para nombrar todas las que puedas de un tema al azar.</div>';
        actionsHtml = '<button class="btn-primary" data-action="start-naming-challenge">Comenzar</button>';
      } else if (n.phase === 'running'){
        nBadge = 'Tema';
        nBody = '<div class="challenge-text">' + esc(n.topic) + '</div>' +
          '<div class="countdown-number">' + n.seconds + '</div>';
        actionsHtml = '';
      } else {
        nBadge = meta.label;
        nBody = '<div class="challenge-text">¡Tiempo!</div>' +
          '<div class="challenge-sub">' + discoDouble(1) + ' trago por cada una que hayas nombrado.</div>';
        actionsHtml = '<button class="btn-primary" data-action="next-turn">Listo, siguiente turno</button>';
      }
      backFace = '<div class="face face-back ' + meta.cls + '">' + turnGlowHtml + '<span class="cat-badge">' + esc(nBadge) + '</span>' + nBody + '</div>';
    } else if (state.card){
      var meta = DECK[state.card.cat];
      var specialMeta = state.card.special && SPECIAL_CARD_META[state.card.special];
      var specialCls = specialMeta ? ' special-' + state.card.special : '';
      var badgeLabel = specialMeta ? specialMeta.label : meta.label;
      var mediaHtml = state.card.image
        ? ("<div class=\"who-photo\"><img src=\"" + esc(state.card.image) + "\" alt=\"\" onerror=\"this.style.display='none'; this.nextElementSibling.style.display='flex';\" /><div class=\"who-photo-fallback\">👤</div></div>")
        : ('<div class="cat-emoji">' + state.card.icon + '</div>');
      var topicHtml = state.card.topic
        ? '<div class="game-topic">' + esc(state.card.topic) + '</div>'
        : '';
      backFace =
        '<div class="face face-back ' + meta.cls + specialCls + '">' +
          turnGlowHtml +
          '<span class="cat-badge">' + esc(badgeLabel) + '</span>' +
          mediaHtml +
          '<div class="challenge-text">' + esc(state.card.text) + '</div>' +
          topicHtml +
          (state.card.sub ? '<div class="challenge-sub">' + esc(state.card.sub) + '</div>' : '') +
          (state.card.answer && state.answerShown ? '<div class="answer-block"><span class="cat-badge">Respuesta</span><div class="challenge-sub">' + esc(state.card.answer) + '</div></div>' : '') +
        '</div>';
      var doneAction = state.card.isSpy ? 'start-espia' : 'next-turn';
      var doneLabel = state.card.isSpy ? 'Empezar ronda de Impostor' : 'Listo, siguiente turno';
      var showAnswerBtn = (state.card.answer && !state.answerShown)
        ? '<button class="btn-ghost" data-action="show-answer">Mostrar respuesta</button>'
        : '';
      actionsHtml = showAnswerBtn + '<button class="btn-primary" data-action="' + doneAction + '">' + doneLabel + '</button>';
    } else {
      backFace = '<div class="face face-back cat-nunca"></div>';
    }

    app.innerHTML = topbar +
      '<div class="rail">' + rail + '</div>' +

      '<div class="stage-wrap">' +
        '<button class="tap-target" data-action="reveal" aria-label="Toca para revelar el reto">' +
          '<div class="flip-card ' + (state.flipped ? 'flipped' : '') + '">' +
            '<div class="face face-front">' +
              turnGlowHtml +
              '<div class="mark">?</div>' +
              '<div class="tap-hint">Toca para revelar tu reto</div>' +
            '</div>' +
            backFace +
          '</div>' +
        '</button>' +

        '<div class="play-actions ' + (state.flipped && actionsHtml ? '' : 'hidden') + '">' +
          actionsHtml +
        '</div>' +
      '</div>';
  }

  function renderCulturaElimination(turnGlowHtml, topbar, rail){
    var meta = state.modoPapu ? { label: 'Modo Papu', cls: 'cat-papu' } : DECK.cultura;
    var aliveIndexes = state.players.map(function(_, i){ return i; }).filter(function(i){ return !state.culturaEliminated[i]; });
    var aliveCount = aliveIndexes.length;

    // Verificar ganador
    if (aliveCount <= 1){
      var winner = aliveCount === 1 ? state.players[aliveIndexes[0]] : null;
      app.innerHTML = topbar +
        '<div class="rail">' + rail + '</div>' +
        '<div class="stage-wrap">' +
          '<div class="face face-back cat-cultura" style="position:static; transform:none; aspect-ratio:3/2.2;">' +
            '<span class="cat-badge">Cultura No General</span>' +
            '<div class="cat-emoji">🏆</div>' +
            (winner
              ? '<div class="challenge-text">¡GANADOR!</div><div class="challenge-sub" style="font-size:22px; margin-top:10px;">' + esc(winner.name) + '</div>'
              : '<div class="challenge-text">Empate</div><div class="challenge-sub">Todos eliminados</div>') +
            '<div class="challenge-sub" style="margin-top:16px;">El juego termino.</div>' +
          '</div>' +
          '<div class="play-actions">' +
            '<button class="btn-primary" data-action="back-setup">Volver a modos</button>' +
          '</div>' +
        '</div>';
      return;
    }

    var backFace, actionsHtml;

    if (!state.card) {
      backFace = '<div class="face face-back ' + meta.cls + '"></div>';
      actionsHtml = '';
    } else {
      var showAnswer = state.answerShown;
      backFace = '<div class="face face-back ' + meta.cls + '">' +
        turnGlowHtml +
        '<span class="cat-badge">' + esc(meta.label) + '</span>' +
        (state.card.image
          ? ("<div class=\"who-photo\"><img src=\"" + esc(state.card.image) + "\" alt=\"\" onerror=\"this.style.display='none'; this.nextElementSibling.style.display='flex';\" /><div class=\"who-photo-fallback\">👤</div></div>")
          : ('<div class="cat-emoji">' + state.card.icon + '</div>')) +
        '<div class="challenge-text">' + esc(state.card.text) + '</div>' +
        (state.card.answer && showAnswer
          ? '<div class="answer-block"><span class="cat-badge">Respuesta</span><div class="challenge-sub">' + esc(state.card.answer) + '</div></div>'
          : '<div class="challenge-sub">¿Acertó la respuesta?</div>') +
      '</div>';

      if (!showAnswer){
        actionsHtml = '<button class="btn-ghost" data-action="show-answer" style="margin-bottom:8px;">Mostrar respuesta</button>';
      } else {
        actionsHtml =
          '<div class="cultura-verdict">' +
            '<button class="btn-primary" data-action="cultura-correct" style="background:linear-gradient(135deg, var(--cyan), var(--lime)); color:var(--ink);">✓ Acertó</button>' +
            '<button class="btn-primary" data-action="cultura-wrong" style="background:linear-gradient(135deg, var(--pink), var(--violet)); color:#fff;">✗ No acertó (-' + state.drinkConfig.culturaDamage + ')</button>' +
          '</div>';
      }
    }

    app.innerHTML = topbar +
      '<div class="rail">' + rail + '</div>' +
      '<div class="stage-wrap">' +
        '<button class="tap-target" data-action="reveal" aria-label="Toca para revelar">' +
          '<div class="flip-card ' + (state.flipped ? 'flipped' : '') + '">' +
            '<div class="face face-front">' +
              turnGlowHtml +
              '<div class="mark">?</div>' +
              '<div class="tap-hint">Toca para ver la pregunta</div>' +
            '</div>' +
            backFace +
          '</div>' +
        '</button>' +
        '<div class="play-actions ' + (state.flipped && actionsHtml ? '' : 'hidden') + '">' +
          actionsHtml +
        '</div>' +
      '</div>';
  }

  function render(){
    if (state.screen === 'welcome') renderWelcome();
    else if (state.screen === 'mode-select') renderModeSelect();
    else if (state.screen === 'player-setup') renderPlayerSetup();
    else if (state.screen === 'ajustes') renderAjustes();
    else renderPlay();
  }

  // Transición cross-fade nativa entre pantallas (setup <-> play) cuando el
  // navegador la soporta; si no, cae de vuelta a un render normal.
  // startViewTransition NO funciona en file:// — solo en HTTPS/localhost.
  var reduceMotionMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var isSecureContext = window.isSecureContext || location.protocol !== 'file:';
  function renderScreenChange(){
    if (isSecureContext && document.startViewTransition && !(reduceMotionMQ && reduceMotionMQ.matches)){
      document.startViewTransition(render);
    } else {
      render();
    }
  }

  app.addEventListener('input', function(e){
    if (e.target.matches('[data-action="secret-input"]')){
      var val = e.target.value.toLowerCase().trim();
      var changed = false;
      
      if (val === 'secreto123') {
        if (!state.modoAmigos) { state.modoAmigos = true; changed = true; }
        if (state.modoPapu) { state.modoPapu = false; changed = true; }
        if (state.modoHistoria) { state.modoHistoria = false; changed = true; }
      } else if (val === 'modopapu') {
        if (!state.modoPapu) { state.modoPapu = true; changed = true; }
        if (state.modoAmigos) { state.modoAmigos = false; changed = true; }
        if (state.modoHistoria) { state.modoHistoria = false; changed = true; }
      } else if (val === 'modohistoria') {
        if (!state.modoHistoria) { state.modoHistoria = true; changed = true; }
        if (state.modoAmigos) { state.modoAmigos = false; changed = true; }
        if (state.modoPapu) { state.modoPapu = false; changed = true; }
      } else {
        if (state.modoAmigos) { state.modoAmigos = false; changed = true; }
        if (state.modoPapu) { state.modoPapu = false; changed = true; }
        if (state.modoHistoria) { state.modoHistoria = false; changed = true; }
      }
      if (changed) render();
    }
  });

  // Evita que un mínimo quede por sobre su máximo (o viceversa) al escribir
  // un número suelto en el configurador de tragos.
  function clampDrinkConfig(){
    var d = state.drinkConfig;
    d.greeting = Math.max(1, Math.min(30, d.greeting || 1));
    d.maxDrinks = Math.max(1, Math.min(30, d.maxDrinks || 1));
    d.eventMin = Math.max(1, Math.min(30, d.eventMin || 1));
    d.eventMax = Math.max(d.eventMin, Math.min(30, d.eventMax || d.eventMin));
    d.nuncaMin = Math.max(1, Math.min(30, d.nuncaMin || 1));
    d.nuncaMax = Math.max(d.nuncaMin, Math.min(30, d.nuncaMax || d.nuncaMin));
    d.culturaDamage = Math.max(1, Math.min(100, d.culturaDamage || 20));
  }

  app.addEventListener('change', function(e){
    if (e.target.matches('[data-action="toggle-futbol"]')){ state.futbol = e.target.checked; render(); }
    if (e.target.matches('[data-action="toggle-disco"]')){ state.disco = e.target.checked; render(); }
    if (e.target.matches('[data-action="toggle-cultura"]')){ state.culturaEnabled = e.target.checked; render(); }
    if (e.target.matches('[data-action="set-drink-config"]')){
      var field = e.target.getAttribute('data-field');
      var val = parseInt(e.target.value, 10);
      if (!isNaN(val)) state.drinkConfig[field] = val;
      clampDrinkConfig();
      render();
    }
  });

  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');

    if (action === 'go-mode-select'){
      state.screen = 'mode-select';
      renderScreenChange();
    } else if (action === 'back-welcome'){
      state.screen = 'welcome';
      state.selectedMode = null;
      renderScreenChange();
    } else if (action === 'select-mode'){
      var mode = t.getAttribute('data-mode');
      state.selectedMode = mode;
      state.players = [];
      state.includeCulturaInPre = false;
      if (mode === 'pre'){
        state.futbol = false;
        state.disco = false;
        state.culturaEnabled = true;
      } else if (mode === 'disco'){
        state.futbol = false;
        state.disco = true;
        state.culturaEnabled = false;
      } else if (mode === 'cultura'){
        state.futbol = false;
        state.disco = false;
        state.culturaEnabled = true;
      }
      else if (mode === 'pasapalabra'){
        state.futbol = false;
        state.disco = false;
        state.culturaEnabled = false;
      }
      state.screen = 'player-setup';
      state.cards = null;
      renderScreenChange();
    } else if (action === 'add-player'){
      var input = document.getElementById('player-input');
      if (input && input.value.trim()) {
        var name = input.value.trim();
        var color = AVATAR_COLORS[state.players.length % AVATAR_COLORS.length];
        state.players.push({ name: name, color: color });
        render();
      }
    } else if (action === 'remove-player'){
      state.players.splice(Number(t.getAttribute('data-idx')), 1);
      render();
    } else if (action === 'back-mode-select'){
      state.screen = 'mode-select';
      state.selectedMode = null;
      renderScreenChange();
    } else if (action === 'toggle-cultura-pre'){
      state.includeCulturaInPre = t.checked;
      render();
    } else if (action === 'open-ajustes'){
      state.screen = 'ajustes';
      renderScreenChange();
    } else if (action === 'close-ajustes'){
      state.screen = 'player-setup';
      renderScreenChange();
    } else if (action === 'set-cards'){
      state.cards = t.getAttribute('data-value');
      render();
    } else if (action === 'start'){
      if (!canStart()) return;
      state.screen = 'play';
      state.turn = 0;
      state.round = 1;
      state.flipped = false;
      state.card = null;
      state.answerShown = false;
      state.espia = null;
      state.wordDrop = null;
      state.naming = null;
      state.lastCategory = null;
      state.history = {};
      state.specials = initSpecials();
      // Modo Cultura No General: inicializar vidas (100 cada uno)
      if (state.selectedMode === 'cultura'){
        state.playerLives = state.players.map(function(){ return 100; });
        state.culturaEliminated = state.players.map(function(){ return false; });
      } else {
        state.playerLives = [];
        state.culturaEliminated = [];
      }
      if (state.selectedMode === 'pasapalabra') {
        state.roscos = state.players.map(function() {
          var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
          var questions = letters.map(function(l) {
            var pool = PASAPALABRA_WORDS[l] || [{text: "Empieza con " + l + ": (Sin palabras)", answer: "..."}];
            var q = pool[Math.floor(Math.random() * pool.length)];
            return { letter: l, text: q.text, answer: q.answer, status: 'pending' };
          });
          return { questions: questions, currentIndex: 0, active: false, finished: false };
        });
        state.playerTimers = state.players.map(function(){ return 120; });
      }
      renderScreenChange();
    } else if (action === 'back-setup'){
      state.screen = 'mode-select';
      state.espia = null;
      renderScreenChange();
    } else if (action === 'reveal'){
      if (state.flipped) return;
      drawChallenge();
      state.flipped = true;
      state.answerShown = false;
      state.wordDrop = null;
      state.naming = null;
      render();
    } else if (action === 'show-answer'){
      state.answerShown = true;
      render();
    } else if (action === 'cultura-correct'){
      // Acertó: vida se queda igual, pasar al siguiente jugador vivo
      state.flipped = false;
      state.card = null;
      state.answerShown = false;
      state.round += 1;
      // Buscar siguiente jugador vivo
      var nextTurn = (state.turn + 1) % state.players.length;
      var attempts = 0;
      while (state.culturaEliminated[nextTurn] && attempts < state.players.length){
        nextTurn = (nextTurn + 1) % state.players.length;
        attempts++;
      }
      state.turn = nextTurn;
      drawChallenge();
      render();
    } else if (action === 'cultura-wrong'){
      // No acertó: restamos la vida configurada
      state.playerLives[state.turn] = Math.max(0, state.playerLives[state.turn] - state.drinkConfig.culturaDamage);
      if (state.playerLives[state.turn] <= 0){
        state.culturaEliminated[state.turn] = true;
      }
      state.flipped = false;
      state.card = null;
      state.answerShown = false;
      state.round += 1;
      // Buscar siguiente jugador vivo
      var nextTurn = (state.turn + 1) % state.players.length;
      var attempts = 0;
      while (state.culturaEliminated[nextTurn] && attempts < state.players.length){
        nextTurn = (nextTurn + 1) % state.players.length;
        attempts++;
      }
      state.turn = nextTurn;
      drawChallenge();
      render();
    } else if (action === 'start-word-drop'){
      startWordDrop();
    } else if (action === 'start-naming-challenge'){
      startNamingChallenge();
    } else if (action === 'next-turn'){
      state.turn = (state.turn + 1) % state.players.length;
      state.round += 1;
      state.flipped = false;
      state.card = null;
      state.answerShown = false;
      state.wordDrop = null;
      state.naming = null;
      render();
      } else if (action === 'pasa-start') {
      startRoscoTimer();
      render();
    } else if (action === 'pasa-acerto') {
      var r = state.roscos[state.turn];
      r.questions[r.currentIndex].status = 'correct';
      if (!checkRoscoEnd()) { advanceRoscoIndex(); render(); }
      else { nextRoscoPlayer(); }
    } else if (action === 'pasa-error') {
      var r = state.roscos[state.turn];
      r.questions[r.currentIndex].status = 'error';
      if (!checkRoscoEnd()) { nextRoscoPlayer(); }
      else { nextRoscoPlayer(); }
    } else if (action === 'pasa-pasapalabra') {
      nextRoscoPlayer();
    } else if (action === 'start-espia'){
      startEspia();
      render();
    } else if (action === 'reveal-espia'){
      if (state.espia.revealed) return;
      state.espia.revealed = true;
      render();
    } else if (action === 'next-espia-step'){
      state.espia.step += 1;
      state.espia.revealed = false;
      render();
    } else if (action === 'finish-espia'){
      state.espia = null;
      state.turn = (state.turn + 1) % state.players.length;
      state.round += 1;
      state.flipped = false;
      state.card = null;
      state.answerShown = false;
      state.wordDrop = null;
      state.naming = null;
      render();
    }
  });

  render();
})();
</script>
