<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Copetapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C0D16" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  /* ================= tokens ================= */
  :root{
    color-scheme: dark;

    --bg:#0C0D16;
    --surface:#151726;
    --surface-2:#1C1F32;
    --surface-3:#25293F;
    --line: rgb(255 255 255 / .08);
    --line-strong: rgb(255 255 255 / .16);

    --text:#F3F4F8;
    --text-2:#B9BDD0;
    --text-3:#959AB3;

    --accent:#F2B84B;
    --accent-ink:#1C1404;
    --success:#3DD68C;
    --success-ink:#062114;
    --danger:#FF6B6B;
    --danger-ink:#2A0606;

    /* Colores de tema de trivia (los usa data/deck.js por nombre) */
    --violet:#8B7CF6;
    --cyan:#2CC5D2;
    --cyan-deep:#1FA393;
    --pink:#EC6AA8;
    --lime:#A6D64A;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;

    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
    --shadow-2: 0 12px 32px -12px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .25);
    --ease: cubic-bezier(.2,.8,.2,1);
    --target: 44px;
  }

  /* ================= base ================= */
  *, *::before, *::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(90% 50% at 50% -10%, rgb(242 184 75 / .09), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:1rem;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-wrap:break-word;
  }
  h1, h2, h3, p{ margin:0; }
  h1, h2{ text-wrap:balance; }
  button, input{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #app:focus{ outline:none; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap;
  }

  .ico{ width:1.25em; height:1.25em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ================= shell ================= */
  .app-shell{
    width:100%; max-width:480px; margin:0 auto; min-height:100dvh;
    display:flex; flex-direction:column;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }
  .app{ flex:1; display:flex; flex-direction:column; }
  .screen{ flex:1; display:flex; flex-direction:column; }

  /* ================= barra superior ================= */
  .topbar{
    display:grid; grid-template-columns:var(--target) 1fr var(--target); align-items:center; gap:8px;
    min-height:var(--target); margin-bottom:8px;
  }
  .topbar-title{ text-align:center; font-family:var(--font-display); font-weight:650; font-size:1.0625rem; letter-spacing:-.01em; }
  .icon-btn{
    inline-size:var(--target); block-size:var(--target);
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    transition:background-color .15s ease, transform .15s var(--ease);
  }
  .icon-btn:active{ transform:scale(.94); background:var(--surface-2); }
  .pill{
    justify-self:center; display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    font-size:.8125rem; font-weight:600; color:var(--text-2); font-variant-numeric:tabular-nums;
  }

  /* ================= botones ================= */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-block-size:52px; padding:12px 18px; border-radius:var(--r-md); border:1px solid transparent;
    font-weight:650; font-size:1rem; letter-spacing:-.005em;
    transition:transform .15s var(--ease), background-color .15s ease, opacity .15s ease;
  }
  .btn:active:not(:disabled){ transform:scale(.97); }
  .btn-block{ width:100%; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); box-shadow:0 8px 24px -10px rgb(242 184 75 / .55); }
  .btn-primary:disabled{ background:var(--surface-3); color:var(--text-3); box-shadow:none; cursor:not-allowed; }
  .btn-secondary{ background:var(--surface-2); border-color:var(--line-strong); color:var(--text); }
  .btn-success{ background:var(--success); color:var(--success-ink); }
  .btn-danger{ background:var(--danger); color:var(--danger-ink); }

  /* ================= inicio ================= */
  .home{ justify-content:center; gap:32px; padding-block:24px; }
  .brand{ display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  .brand-mark{
    inline-size:64px; block-size:64px; border-radius:18px; display:grid; place-items:center;
    background:linear-gradient(145deg, #F7CB72, var(--accent) 55%, #D9962A);
    color:var(--accent-ink); font-family:var(--font-display); font-weight:800; font-size:2rem;
    box-shadow:0 14px 36px -12px rgb(242 184 75 / .6), inset 0 1px 0 rgb(255 255 255 / .35);
  }
  .brand h1{ font-family:var(--font-display); font-weight:800; font-size:clamp(2rem, 1.4rem + 3vw, 2.5rem); letter-spacing:-.03em; line-height:1.1; }
  .brand p{ color:var(--text-2); font-size:.9375rem; max-width:30ch; }

  .mode-list{ display:grid; gap:12px; }
  .mode-card{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:16px;
    width:100%; padding:18px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow-1);
    transition:transform .15s var(--ease), border-color .15s ease, background-color .15s ease;
  }
  .mode-card:active{ transform:scale(.98); background:var(--surface-2); }
  @media (hover:hover){ .mode-card:hover{ border-color:var(--line-strong); } }
  .mode-icon{
    inline-size:52px; block-size:52px; border-radius:14px; display:grid; place-items:center; font-size:1.5rem;
    background:color-mix(in oklab, var(--tone) 18%, var(--surface-2)); color:var(--tone);
    border:1px solid color-mix(in oklab, var(--tone) 35%, transparent);
  }
  .mode-icon .ico{ width:28px; height:28px; }
  .mode-card strong{ display:block; font-size:1.0625rem; font-weight:650; letter-spacing:-.01em; }
  .mode-desc{ display:block; color:var(--text-2); font-size:.875rem; margin-top:2px; line-height:1.4; }
  .mode-card .chev{ color:var(--text-3); }

  /* ================= setup ================= */
  .section{ margin-top:24px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .section-title{ font-size:.8125rem; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2); }
  .section-meta{ font-size:.8125rem; color:var(--text-3); font-variant-numeric:tabular-nums; }
  .help{ color:var(--text-3); font-size:.8125rem; margin-top:10px; line-height:1.45; }

  .player-form{ display:flex; gap:8px; }
  .field{
    flex:1; min-width:0; min-block-size:var(--target);
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-md);
    padding:12px 14px; font-size:max(1rem, 1em);
    transition:border-color .15s ease, background-color .15s ease;
  }
  .field::placeholder{ color:var(--text-3); }
  .field:focus-visible{ outline:2px solid var(--accent); outline-offset:0; border-color:transparent; }
  .add-btn{
    inline-size:52px; min-block-size:var(--target); flex:none; border-radius:var(--r-md); border:none;
    background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
  }
  .add-btn:active{ transform:scale(.94); }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{
    display:inline-flex; align-items:center; gap:8px; padding:4px 4px 4px 4px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px; font-size:.9375rem; font-weight:500;
  }
  @media (prefers-reduced-motion: no-preference){
    .chip{ animation:pop-in .25s var(--ease) both; }
  }
  @keyframes pop-in{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:none; } }
  .chip-remove{
    inline-size:32px; block-size:32px; border-radius:999px; border:none; background:transparent; color:var(--text-3);
    display:grid; place-items:center; position:relative;
  }
  .chip-remove::after{ content:""; position:absolute; inset:-6px; } /* área táctil ≥44px */
  .chip-remove:active{ background:var(--surface-3); }
  .avatar{
    inline-size:28px; block-size:28px; border-radius:999px; flex:none; display:grid; place-items:center;
    background:var(--c); color:#0C0D16; font-weight:750; font-size:.8125rem;
  }

  .topics{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .topic{
    position:relative; display:flex; align-items:center; gap:10px; min-block-size:64px; padding:10px 12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); cursor:pointer;
    transition:border-color .15s ease, background-color .15s ease, transform .15s var(--ease);
  }
  .topic:active{ transform:scale(.98); }
  .topic-icon{
    inline-size:38px; block-size:38px; border-radius:10px; flex:none; display:grid; place-items:center; font-size:1.25rem;
    background:color-mix(in oklab, var(--topic-color) 20%, var(--surface-2));
  }
  .topic-name{ font-size:.875rem; font-weight:600; line-height:1.25; }
  .topic-count{ display:block; color:var(--text-3); font-size:.75rem; font-weight:400; margin-top:2px; font-variant-numeric:tabular-nums; }
  .topic-check{
    position:absolute; top:8px; right:8px; inline-size:20px; block-size:20px; border-radius:999px;
    display:grid; place-items:center; font-size:.75rem;
    border:1.5px solid var(--line-strong); color:transparent;
  }
  .topic:has(:checked){ border-color:var(--topic-color); background:color-mix(in oklab, var(--topic-color) 10%, var(--surface)); }
  .topic:has(:checked) .topic-check{ background:var(--topic-color); border-color:var(--topic-color); color:#0C0D16; }
  .topic:has(:focus-visible){ outline:2px solid var(--accent); outline-offset:2px; }
  .topic:has(:disabled){ opacity:.45; cursor:not-allowed; }

  .mode-note{
    margin-top:12px; padding:12px 14px; border-radius:var(--r-md);
    background:var(--surface); border:1px solid var(--line); color:var(--text-2); font-size:.8125rem; line-height:1.45;
  }
  .mode-note strong{ color:var(--text); font-weight:600; }

  .cta-bar{
    position:sticky; bottom:0; margin-top:auto; padding-top:24px;
    padding-bottom:max(4px, env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, transparent, var(--bg) 40%);
  }
  .cta-hint{ text-align:center; color:var(--text-3); font-size:.8125rem; margin-top:8px; min-block-size:1.2em; }

  /* ================= ajustes ================= */
  .group{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; min-block-size:56px; }
  .row + .row{ border-top:1px solid var(--line); }
  .row-label{ font-size:.9375rem; }
  .row-label small{ display:block; color:var(--text-3); font-size:.8125rem; }
  .num{
    inline-size:84px; min-block-size:var(--target); text-align:center; border-radius:var(--r-sm);
    background:var(--surface-2); border:1px solid var(--line-strong);
    font-family:var(--font-mono); font-size:max(1rem, 1em); font-variant-numeric:tabular-nums;
  }
  .num:focus-visible{ outline:2px solid var(--accent); outline-offset:0; }
  .status-msg{ margin-top:10px; font-size:.875rem; color:var(--success); }

  /* ================= partida: jugadores ================= */
  .rail{ display:flex; gap:14px; overflow-x:auto; padding:10px 2px 12px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .rail::-webkit-scrollbar{ display:none; }
  .rail-player{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; inline-size:56px; scroll-snap-align:center; opacity:.55; transition:opacity .2s ease; }
  .rail-player .avatar{ inline-size:40px; block-size:40px; font-size:.9375rem; transition:box-shadow .2s ease; }
  .rail-player.current{ opacity:1; }
  .rail-player.current .avatar{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .rail-player.out{ opacity:.35; }
  .rail-player.out .avatar{ filter:grayscale(1); }
  .rail-name{ font-size:.75rem; color:var(--text-2); max-inline-size:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-player.current .rail-name{ color:var(--text); font-weight:600; }
  .life{ inline-size:40px; block-size:4px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
  .life > span{ display:block; block-size:100%; inline-size:var(--life); background:var(--success); border-radius:inherit; }
  .life.low > span{ background:var(--danger); }
  .badges{ display:flex; flex-wrap:wrap; justify-content:center; gap:3px; min-block-size:4px; }
  .badge-dot{ inline-size:16px; block-size:16px; border-radius:6px; display:grid; place-items:center; font-size:.625rem; background:color-mix(in oklab, var(--topic-color) 35%, var(--surface-2)); }

  .status-line{ display:flex; justify-content:center; gap:8px; margin-top:4px; }
  .status-line .heart{ color:var(--pink); }

  /* ================= carta de trivia ================= */
  .stage{ margin-top:10px; perspective:1400px; }
  .tap-target{ display:block; width:100%; padding:0; border:0; background:none; text-align:inherit; border-radius:var(--r-xl); }
  .flip-card{
    position:relative; width:100%; aspect-ratio:4/5; max-block-size:58dvh; margin-inline:auto;
    transform-style:preserve-3d; transition:transform .6s var(--ease);
  }
  .flip-card.flipped{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion: reduce){ .flip-card{ transition:none; } }
  .face{
    position:absolute; inset:0; border-radius:var(--r-xl); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; padding:24px; overflow-y:auto; scrollbar-width:none;
    border:1px solid var(--line); box-shadow:var(--shadow-2);
  }
  .face::-webkit-scrollbar{ display:none; }
  .face-front{
    align-items:center; justify-content:center; text-align:center; gap:10px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgb(242 184 75 / .10), transparent 60%),
      var(--surface);
  }
  .face-front .eyebrow{ color:var(--text-3); font-size:.8125rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .face-front .who{ font-family:var(--font-display); font-size:clamp(1.75rem, 1.2rem + 3vw, 2.25rem); font-weight:750; letter-spacing:-.02em; line-height:1.15; }
  .face-front .hint{ display:inline-flex; align-items:center; gap:6px; margin-top:18px; color:var(--text-2); font-size:.875rem; padding:8px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
  .face-back{
    transform:rotateY(180deg); background:var(--surface); gap:16px;
    border-top:4px solid var(--topic-color, var(--accent));
  }
  .topic-tag{
    align-self:flex-start; display:inline-flex; align-items:center; gap:6px;
    padding:5px 10px; border-radius:999px; font-size:.8125rem; font-weight:600;
    background:color-mix(in oklab, var(--topic-color, var(--accent)) 18%, var(--surface-2)); color:var(--text);
  }
  .question{ font-family:var(--font-display); font-size:clamp(1.25rem, 1rem + 1.4vw, 1.5rem); font-weight:650; line-height:1.3; letter-spacing:-.01em; text-wrap:pretty; margin-block:auto; }
  .answer{ border-top:1px solid var(--line); padding-top:14px; }
  .answer-label{ color:var(--text-3); font-size:.75rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .answer-text{ color:var(--accent); font-size:1.125rem; font-weight:650; margin-top:2px; }
  @media (prefers-reduced-motion: no-preference){
    .answer, .actions{ animation:rise .3s var(--ease) both; }
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .actions{ display:grid; gap:10px; margin-top:14px; }
  .actions.two{ grid-template-columns:1fr 1fr; }

  /* ================= resultados ================= */
  .result{
    margin-top:12px; padding:32px 24px; border-radius:var(--r-xl); text-align:center;
    background:radial-gradient(120% 70% at 50% 0%, rgb(242 184 75 / .14), transparent 65%), var(--surface);
    border:1px solid var(--line); box-shadow:var(--shadow-2);
  }
  .result .trophy{ inline-size:64px; block-size:64px; margin:0 auto 14px; border-radius:20px; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); }
  .result .trophy .ico{ width:32px; height:32px; }
  .result h2{ font-family:var(--font-display); font-size:1.75rem; font-weight:800; letter-spacing:-.02em; }
  .result p{ color:var(--text-2); margin-top:6px; }
  .scoreboard{ list-style:none; margin:20px 0 0; padding:0; text-align:left; }
  .scoreboard li{ display:grid; grid-template-columns:28px 1fr auto auto; gap:12px; align-items:center; padding:12px 4px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .scoreboard .rank{ color:var(--text-3); font-weight:650; }
  .scoreboard li:first-child .rank{ color:var(--accent); }
  .scoreboard .muted{ color:var(--text-3); font-size:.875rem; }

  /* ================= pasapalabra ================= */
  .rosco{
    position:relative; inline-size:min(78vw, 300px); aspect-ratio:1; margin:8px auto 0;
  }
  .rosco::before{ content:""; position:absolute; inset:7%; border-radius:50%; border:1px dashed var(--line-strong); }
  .rosco-letter{
    --r:43%;
    position:absolute; left:calc(50% + cos(var(--a)) * var(--r)); top:calc(50% + sin(var(--a)) * var(--r));
    translate:-50% -50%; inline-size:28px; block-size:28px; border-radius:999px; display:grid; place-items:center;
    font-size:.75rem; font-weight:750; background:var(--surface-2); color:var(--text-2); border:1px solid var(--line-strong);
  }
  .rosco-letter.correct{ background:var(--success); color:var(--success-ink); border-color:transparent; }
  .rosco-letter.error{ background:var(--danger); color:var(--danger-ink); border-color:transparent; text-decoration:line-through; }
  .rosco-letter.current{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); color:var(--text); }
  .rosco-center{ position:absolute; inset:24%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; }
  .rosco-center .who{ font-family:var(--font-display); font-size:1.25rem; font-weight:750; line-height:1.15; }
  .rosco-center .muted{ color:var(--text-3); font-size:.8125rem; }
  .tally{ display:flex; justify-content:center; gap:16px; margin-top:14px; font-size:.875rem; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .tally span{ display:inline-flex; align-items:center; gap:6px; }
  .tally .ok{ color:var(--success); }
  .tally .ko{ color:var(--danger); }

  .pasa-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px; }
  .big-letter{
    inline-size:72px; block-size:72px; border-radius:20px; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink); font-family:var(--font-display); font-size:2.5rem; font-weight:800;
  }
  .timer{ font-family:var(--font-mono); font-size:2.25rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .timer.is-low{ color:var(--danger); }
  .pasa-card{ margin-top:14px; padding:22px; border-radius:var(--r-xl); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-2); }
  .pasa-card .question{ margin:0; }
  .pasa-card .answer{ margin-top:16px; }
  .actions.three{ grid-template-columns:1fr 1fr 1fr; }
  .actions.three .btn{ flex-direction:column; gap:4px; padding:10px 6px; font-size:.875rem; min-block-size:64px; }

  @media (forced-colors: active){
    .btn, .icon-btn, .mode-card, .topic, .chip, .face, .result, .pasa-card, .group{ border:1px solid CanvasText; }
    .rosco-letter.current{ outline:2px solid Highlight; }
  }
</style>
</head>
<body>

<!-- Íconos: un único sprite inline, reutilizado con <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>

<main class="app-shell">
  <div class="app" id="app" tabindex="-1"></div>
</main>

<script src="data/deck.js"></script>
<script src="data/pasapalabra.js"></script>
<script>
(function(){
  'use strict';

  var DECK = window.DECK || {};
  var TRIVIA = DECK.trivia || {};
  var PASAPALABRA_WORDS = window.PASAPALABRA_WORDS || {};
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var AVATAR_COLORS = ['var(--accent)', 'var(--cyan)', 'var(--pink)', 'var(--violet)', 'var(--lime)', '#F59E73'];
  var MAX_TOPICS = 6;
  var COMPETITIVE_MIN_TOPICS = 4;

  var TOPIC_NAMES = {
    cine: 'Cine', series_tv: 'Series y TV', Disney: 'Disney', musica: 'Música', futbol: 'Fútbol',
    historia_geografia: 'Historia y Geografía', ciencia: 'Ciencia', superheroes: 'Superhéroes', papu: 'Modo Papu'
  };
  var MODES = {
    cultura: { title: 'Cultura No General', desc: 'Trivia por temas: vidas o carrera por chapas.', icon: 'bulb', tone: 'var(--violet)' },
    pasapalabra: { title: 'Pasapalabra', desc: 'El rosco contrarreloj, una palabra por letra.', icon: 'rosco', tone: 'var(--cyan)' }
  };

  var state = {
    screen: 'home',            // home | setup | ajustes | play
    selectedMode: null,        // cultura | pasapalabra
    players: [],
    settings: { culturaDamage: 20, pasapalabraTime: 120 },
    modoHistoria: false,
    modoPapu: false,
    trucoMensaje: '',
    selectedTopics: [],
    triviaScores: [],
    triviaBadges: [],
    triviaTopicQueues: [],
    triviaRound: null,
    triviaWinner: null,
    triviaLives: [],
    turn: 0,
    round: 1,
    flipped: false,
    card: null,
    answerShown: false,
    history: {},
    roscos: [],
    playerTimers: []
  };

  var app = document.getElementById('app');

  /* ---------------- utilidades ---------------- */
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function initials(name){ return name.trim().slice(0, 1).toUpperCase(); }
  function icon(name){ return '<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-' + name + '"/></svg>'; }
  function topicName(key){ return TOPIC_NAMES[key] || key.replace(/_/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }); }
  function topicColor(key){ return (TRIVIA[key] && TRIVIA[key].color) || 'var(--accent)'; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function toEntry(item){ return (typeof item === 'string') ? { text: item, answer: null } : item; }
  function identityOf(item){
    if (typeof item === 'string') return item;
    if (item.text !== undefined) return item.text;
    return JSON.stringify(item);
  }
  function saveHistoryToStorage(){
    try { localStorage.setItem('copete_history', JSON.stringify(state.history)); } catch(e){}
  }
  function pickWithHistory(historyKey, weightedEntries){
    var used = state.history[historyKey] || (state.history[historyKey] = []);
    var avail = weightedEntries.filter(function(e){ return used.indexOf(identityOf(e.item)) === -1; });
    if (avail.length === 0){ used.length = 0; avail = weightedEntries; }
    var total = avail.reduce(function(sum, e){ return sum + e.w; }, 0);
    var r = Math.random() * total;
    var picked = avail[avail.length - 1].item;
    for (var i = 0; i < avail.length; i++){
      r -= avail[i].w;
      if (r <= 0){ picked = avail[i].item; break; }
    }
    used.push(identityOf(picked));
    saveHistoryToStorage();
    return picked;
  }

  function canStart(){
    if (state.players.length < 2) return false;
    if (state.selectedMode === 'cultura') return state.selectedTopics.length >= 1;
    return true;
  }
  function startHint(){
    if (state.players.length < 2) return 'Agrega al menos 2 jugadores.';
    if (state.selectedMode === 'cultura' && !state.selectedTopics.length) return 'Elige al menos un tema.';
    return '';
  }

  /* ---------------- Pasapalabra: sin repetir palabras ---------------- */
  var PASA_USED_KEY = 'copete_pasapalabra_usadas';
  function pasaWordKey(answer){
    return String(answer || '').trim().toLowerCase()
      .replace(/ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'ñ');
  }
  function loadPasaUsed(){
    try {
      var raw = JSON.parse(localStorage.getItem(PASA_USED_KEY) || '{}');
      return (raw && typeof raw === 'object') ? raw : {};
    } catch(e){ return {}; }
  }
  function savePasaUsed(used){
    try { localStorage.setItem(PASA_USED_KEY, JSON.stringify(used)); } catch(e){}
  }
  // Devuelve { letra: [palabra jugador 0, palabra jugador 1, ...] }. Prioriza palabras
  // nunca jugadas en este dispositivo; al agotarse una letra, reinicia solo esa letra.
  function pickPasapalabraWords(letters, nPlayers){
    var used = loadPasaUsed();
    var result = {};
    letters.forEach(function(l){
      var seen = {};
      var pool = (PASAPALABRA_WORDS[l] || []).filter(function(q){
        var k = pasaWordKey(q && q.answer);
        if (!k || seen[k]) return false;
        seen[k] = true;
        return true;
      });
      if (!pool.length) pool = [{ text: 'Empieza con ' + l, answer: '...' }];
      var usedSet = {};
      (used[l] || []).forEach(function(k){ usedSet[k] = true; });
      var fresh = shuffle(pool.filter(function(q){ return !usedSet[pasaWordKey(q.answer)]; }));
      var old = shuffle(pool.filter(function(q){ return usedSet[pasaWordKey(q.answer)]; }));
      var picks = fresh.slice(0, nPlayers);
      var resetLetter = picks.length < nPlayers;
      if (resetLetter) picks = picks.concat(old.slice(0, nPlayers - picks.length));
      while (picks.length < nPlayers) picks.push(pool[Math.floor(Math.random() * pool.length)]);
      var pickedKeys = picks.map(function(q){ return pasaWordKey(q.answer); });
      used[l] = resetLetter ? pickedKeys : (used[l] || []).concat(pickedKeys);
      result[l] = picks;
    });
    savePasaUsed(used);
    return result;
  }

  /* ---------------- Pasapalabra: rosco y reloj ---------------- */
  var roscoTimerInterval = null;

  function startRoscoTimer(){
    if (roscoTimerInterval) clearInterval(roscoTimerInterval);
    state.roscos[state.turn].active = true;
    roscoTimerInterval = setInterval(function(){
      if (state.screen !== 'play' || !state.roscos[state.turn] || !state.roscos[state.turn].active) return;
      state.playerTimers[state.turn]--;
      if (state.playerTimers[state.turn] <= 0){
        state.playerTimers[state.turn] = 0;
        state.roscos[state.turn].questions.forEach(function(q){ if (q.status === 'pending') q.status = 'error'; });
        checkRoscoEnd();
        nextRoscoPlayer();
      } else {
        var el = document.querySelector('.timer');
        if (el){
          el.textContent = formatTime(state.playerTimers[state.turn]);
          el.classList.toggle('is-low', state.playerTimers[state.turn] <= 10);
        } else render();
      }
    }, 1000);
  }
  function stopRoscoTimer(){
    if (state.roscos[state.turn]) state.roscos[state.turn].active = false;
    if (roscoTimerInterval) clearInterval(roscoTimerInterval);
    roscoTimerInterval = null;
  }
  function advanceRoscoIndex(){
    var r = state.roscos[state.turn];
    for (var i = 1; i <= r.questions.length; i++){
      var idx = (r.currentIndex + i) % r.questions.length;
      if (r.questions[idx].status === 'pending'){ r.currentIndex = idx; return true; }
    }
    return false;
  }
  function checkRoscoEnd(){
    var r = state.roscos[state.turn];
    var pending = r.questions.filter(function(q){ return q.status === 'pending'; }).length;
    if (pending === 0){ stopRoscoTimer(); r.finished = true; return true; }
    return false;
  }
  function nextRoscoPlayer(){
    stopRoscoTimer();
    advanceRoscoIndex();
    var attempts = 0;
    do {
      state.turn = (state.turn + 1) % state.players.length;
      attempts++;
    } while (state.roscos[state.turn].finished && attempts < state.players.length);
    render();
  }
  function formatTime(s){ var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function roscoCounts(r){
    var c = { correct: 0, error: 0, pending: 0 };
    r.questions.forEach(function(q){ c[q.status]++; });
    return c;
  }

  /* ---------------- Trivia ---------------- */
  function isCompetitiveTrivia(){ return state.selectedTopics.length >= COMPETITIVE_MIN_TOPICS; }

  function chooseTriviaQuestion(topicKey){
    var topic = TRIVIA[topicKey];
    if (!topic || !topic.questions.length){
      return { topic: topicKey, empty: true, question: { text: 'Este tema todavía no tiene preguntas.', answer: null } };
    }
    var question = pickWithHistory('trivia-questions-' + topicKey, topic.questions.map(function(item){ return { item: toEntry(item), w: 1 }; }));
    return { topic: topicKey, question: question };
  }
  function refillTriviaTopicQueues(){
    state.triviaTopicQueues = state.players.map(function(){ return shuffle(state.selectedTopics); });
  }
  function nextTriviaQuestion(){
    // Trucos: Modo Historia / Modo Papu fuerzan un único tema.
    if (state.modoHistoria) return chooseTriviaQuestion('historia_geografia');
    if (state.modoPapu) return chooseTriviaQuestion(TRIVIA.papu ? 'papu' : 'cine');
    if (!state.triviaTopicQueues.length) refillTriviaTopicQueues();
    var queue = state.triviaTopicQueues[state.turn];
    if (!queue.length){
      if (state.triviaTopicQueues.every(function(q){ return q.length === 0; })) refillTriviaTopicQueues();
      queue = state.triviaTopicQueues[state.turn];
    }
    return chooseTriviaQuestion(queue.shift());
  }
  function advanceTriviaTurn(correct){
    var round = state.triviaRound;
    if (correct){
      if (isCompetitiveTrivia() && state.triviaScores[state.turn][round.topic] !== undefined){
        var scores = state.triviaScores[state.turn];
        scores[round.topic] += 1;
        if (scores[round.topic] >= 3 && state.triviaBadges[state.turn].indexOf(round.topic) === -1) state.triviaBadges[state.turn].push(round.topic);
        if (state.triviaBadges[state.turn].length === state.selectedTopics.length){
          state.triviaWinner = state.turn;
          state.triviaRound = null;
          render();
          return;
        }
      }
    } else if (!isCompetitiveTrivia()){
      state.triviaLives[state.turn] = Math.max(0, state.triviaLives[state.turn] - Number(state.settings.culturaDamage || 0));
    }
    state.triviaRound = null;
    state.answerShown = false;
    state.flipped = false;
    var attempts = 0;
    do {
      state.turn = (state.turn + 1) % state.players.length;
      attempts++;
    } while (!isCompetitiveTrivia() && state.triviaLives[state.turn] <= 0 && attempts < state.players.length);
    state.round += 1;
    render();
  }

  /* ---------------- vistas ---------------- */
  function topbar(opts){
    return '<header class="topbar">' +
      (opts.back ? '<button type="button" class="icon-btn" data-action="' + opts.back + '" aria-label="' + esc(opts.backLabel || 'Volver') + '">' + icon('back') + '</button>' : '<span></span>') +
      (opts.pill ? '<span class="pill">' + opts.pill + '</span>' : '<h1 class="topbar-title">' + esc(opts.title || '') + '</h1>') +
      (opts.right || '<span></span>') +
    '</header>';
  }

  function renderHome(){
    var cards = Object.keys(MODES).map(function(key){
      var m = MODES[key];
      return '<button type="button" class="mode-card" data-action="select-mode" data-mode="' + key + '">' +
        '<span class="mode-icon" style="--tone:' + m.tone + '">' + icon(m.icon) + '</span>' +
        '<span><strong>' + esc(m.title) + '</strong><span class="mode-desc">' + esc(m.desc) + '</span></span>' +
        '<span class="chev">' + icon('chev') + '</span>' +
      '</button>';
    }).join('');
    app.innerHTML =
      '<section class="screen home">' +
        '<div class="brand">' +
          '<div class="brand-mark" aria-hidden="true">C</div>' +
          '<h1>Copetapp</h1>' +
        '</div>' +
        '<div><h2 class="section-title" style="margin-bottom:10px;">Elige un modo</h2><div class="mode-list">' + cards + '</div></div>' +
      '</section>';
  }

  function renderTopicPicker(){
    var keys = Object.keys(TRIVIA).filter(function(k){ return k !== 'papu'; });
    var full = state.selectedTopics.length >= MAX_TOPICS;
    var tiles = keys.map(function(key){
      var t = TRIVIA[key];
      var checked = state.selectedTopics.indexOf(key) !== -1;
      return '<label class="topic" style="--topic-color:' + t.color + '">' +
        '<input class="visually-hidden" type="checkbox" data-action="toggle-topic" data-topic="' + esc(key) + '"' + (checked ? ' checked' : '') + (full && !checked ? ' disabled' : '') + ' />' +
        '<span class="topic-icon" aria-hidden="true">' + t.icon + '</span>' +
        '<span class="topic-name">' + esc(topicName(key)) + '<span class="topic-count">' + t.questions.length + ' preguntas</span></span>' +
        '<span class="topic-check" aria-hidden="true">' + icon('check') + '</span>' +
      '</label>';
    }).join('');
    var n = state.selectedTopics.length;
    var note = n === 0 ? 'Elige entre 1 y ' + MAX_TOPICS + ' temas.'
      : (n >= COMPETITIVE_MIN_TOPICS
        ? '<strong>Carrera por chapas:</strong> gana quien consiga 3 aciertos en cada tema elegido.'
        : '<strong>Modo vidas:</strong> todos parten con 100. Cada error resta ' + esc(String(state.settings.culturaDamage)) + '. Gana el último en pie. Con ' + COMPETITIVE_MIN_TOPICS + ' temas o más se juega por chapas.');
    return '<fieldset class="section" style="border:0; padding:0; margin-inline:0; min-width:0;">' +
      '<legend class="section-head" style="width:100%; padding:0;"><span class="section-title">Temas</span></legend>' +
      '<p class="section-meta" style="margin:-6px 0 10px;">' + n + ' de ' + MAX_TOPICS + ' elegidos</p>' +
      '<div class="topics">' + tiles + '</div>' +
      '<p class="mode-note">' + note + '</p>' +
    '</fieldset>';
  }

  function renderSetup(){
    var mode = MODES[state.selectedMode];
    var chips = state.players.map(function(p, i){
      return '<li class="chip"><span class="avatar" style="--c:' + p.color + '" aria-hidden="true">' + esc(initials(p.name)) + '</span>' +
        '<span>' + esc(p.name) + '</span>' +
        '<button type="button" class="chip-remove" data-action="remove-player" data-idx="' + i + '" aria-label="Quitar a ' + esc(p.name) + '">' + icon('x') + '</button></li>';
    }).join('');
    var hint = startHint();
    app.innerHTML =
      '<section class="screen">' +
        topbar({ back: 'go-home', backLabel: 'Volver al inicio', title: mode.title,
          right: '<button type="button" class="icon-btn" data-action="open-ajustes" aria-label="Ajustes">' + icon('settings') + '</button>' }) +
        '<div class="section">' +
          '<div class="section-head"><h2 class="section-title">Jugadores</h2><span class="section-meta">' + state.players.length + '</span></div>' +
          '<form class="player-form" data-form="add-player">' +
            '<label for="player-input" class="visually-hidden">Nombre del jugador</label>' +
            '<input class="field" id="player-input" name="player" type="text" placeholder="Nombre del jugador" maxlength="16" autocomplete="off" autocapitalize="words" enterkeyhint="done" />' +
            '<button class="add-btn" type="submit" aria-label="Agregar jugador">' + icon('plus') + '</button>' +
          '</form>' +
          (chips ? '<ul class="chips" style="list-style:none; padding:0; margin-block-end:0;">' + chips + '</ul>' : '<p class="help">Escribe un nombre y toca + para sumar jugadores.</p>') +
        '</div>' +
        (state.selectedMode === 'cultura' ? renderTopicPicker() : '') +
        (state.selectedMode === 'pasapalabra'
          ? '<p class="mode-note">Cada jugador tiene su propio rosco de 26 letras y <strong>' + formatTime(state.settings.pasapalabraTime) + '</strong> de tiempo. Quien sostiene el teléfono lee la definición y marca la respuesta.</p>'
          : '') +
        '<div class="cta-bar">' +
          '<button type="button" class="btn btn-primary btn-block" data-action="start"' + (canStart() ? '' : ' disabled') + '>Empezar partida</button>' +
          '<p class="cta-hint" aria-live="polite">' + esc(hint) + '</p>' +
        '</div>' +
      '</section>';
  }

  function numberRow(label, sub, field, min, max){
    var id = 'set-' + field;
    return '<div class="row"><label class="row-label" for="' + id + '">' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</label>' +
      '<input class="num" id="' + id + '" type="number" inputmode="numeric" min="' + min + '" max="' + max + '" data-action="set-setting" data-field="' + field + '" value="' + state.settings[field] + '" /></div>';
  }

  function renderAjustes(){
    var modeSettings = state.selectedMode === 'pasapalabra'
      ? numberRow('Tiempo por jugador', 'En segundos', 'pasapalabraTime', 30, 600)
      : numberRow('Daño por error', 'Vida que se pierde al fallar (modo vidas)', 'culturaDamage', 1, 100);
    app.innerHTML =
      '<section class="screen">' +
        topbar({ back: 'close-ajustes', backLabel: 'Volver', title: 'Ajustes' }) +
        '<div class="section"><h2 class="section-title" style="margin-bottom:10px;">' + esc(MODES[state.selectedMode].title) + '</h2>' +
          '<div class="group">' + modeSettings + '</div></div>' +
        (state.selectedMode === 'cultura'
          ? '<div class="section"><h2 class="section-title" style="margin-bottom:10px;">Trucos</h2>' +
              '<form class="player-form" data-form="truco">' +
                '<label for="truco-input" class="visually-hidden">Clave secreta</label>' +
                '<input class="field" id="truco-input" type="text" placeholder="Clave secreta" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" />' +
                '<button class="add-btn" type="submit" aria-label="Activar clave">' + icon('lock') + '</button>' +
              '</form>' +
              '<p class="status-msg" role="status">' + esc(state.trucoMensaje) + '</p>' +
            '</div>'
          : '') +
      '</section>';
  }

  function renderRail(){
    var showLives = state.selectedMode === 'cultura' && !isCompetitiveTrivia();
    var showBadges = state.selectedMode === 'cultura' && isCompetitiveTrivia();
    return '<ol class="rail" aria-label="Jugadores" style="list-style:none; margin:0;">' + state.players.map(function(p, i){
      var out = showLives && state.triviaLives[i] <= 0;
      var extra = '';
      if (showLives){
        var life = state.triviaLives[i];
        extra = '<span class="life' + (life <= 40 ? ' low' : '') + '" style="--life:' + life + '%"><span></span></span><span class="visually-hidden">' + life + ' de vida</span>';
      } else if (showBadges){
        extra = '<span class="badges">' + (state.triviaBadges[i] || []).map(function(k){
          return '<span class="badge-dot" style="--topic-color:' + topicColor(k) + '" title="' + esc(topicName(k)) + '">' + TRIVIA[k].icon + '</span>';
        }).join('') + '</span>';
      }
      return '<li class="rail-player' + (i === state.turn ? ' current' : '') + (out ? ' out' : '') + '"' + (i === state.turn ? ' aria-current="true"' : '') + '>' +
        '<span class="avatar" style="--c:' + p.color + '" aria-hidden="true">' + esc(initials(p.name)) + '</span>' +
        '<span class="rail-name">' + esc(p.name) + '</span>' + extra + '</li>';
    }).join('') + '</ol>';
  }

  function resultCard(title, sub, extra){
    return '<div class="result"><div class="trophy">' + icon('trophy') + '</div><h2>' + title + '</h2><p>' + sub + '</p>' + (extra || '') + '</div>' +
      '<div class="actions"><button type="button" class="btn btn-primary btn-block" data-action="play-again">Jugar otra vez</button>' +
      '<button type="button" class="btn btn-secondary btn-block" data-action="go-home">Volver al inicio</button></div>';
  }

  function renderTriviaPlay(){
    var bar = topbar({ back: 'leave-game', backLabel: 'Salir de la partida', pill: 'Ronda ' + state.round });
    var alive = state.players.map(function(_, i){ return i; }).filter(function(i){ return state.triviaLives[i] > 0; });
    var finishedLives = !isCompetitiveTrivia() && alive.length <= 1;
    if (finishedLives || state.triviaWinner !== null){
      var winner = finishedLives ? state.players[alive[0]] : state.players[state.triviaWinner];
      var sub = isCompetitiveTrivia() ? 'Consiguió las chapas de todos los temas.' : 'Fue el último jugador con vida.';
      return bar + renderRail() + resultCard(winner ? '¡' + esc(winner.name) + ' gana!' : 'Sin ganador', sub);
    }
    if (!state.triviaRound) state.triviaRound = nextTriviaQuestion();
    var round = state.triviaRound;
    var color = topicColor(round.topic);
    var t = TRIVIA[round.topic];
    var player = state.players[state.turn];

    var status = !isCompetitiveTrivia()
      ? '<div class="status-line"><span class="pill"><span class="heart">' + icon('heart') + '</span> ' + state.triviaLives[state.turn] + ' · −' + esc(String(state.settings.culturaDamage)) + ' por error</span></div>'
      : '<div class="status-line"><span class="pill">' + (t ? t.icon + ' ' : '') + (state.triviaScores[state.turn][round.topic] || 0) + ' / 3 en ' + esc(topicName(round.topic)) + '</span></div>';

    var answer = round.question.answer && state.answerShown
      ? '<div class="answer"><div class="answer-label">Respuesta</div><div class="answer-text">' + esc(round.question.answer) + '</div></div>' : '';

    var card =
      '<button type="button" class="tap-target" data-action="trivia-reveal" aria-label="' + (state.flipped ? 'Pregunta revelada' : 'Revelar la pregunta de ' + esc(player.name)) + '">' +
        '<div class="flip-card' + (state.flipped ? ' flipped' : '') + '" style="--topic-color:' + color + '">' +
          '<div class="face face-front"' + (state.flipped ? ' aria-hidden="true"' : '') + '>' +
            '<span class="eyebrow">Turno de</span><span class="who">' + esc(player.name) + '</span>' +
            '<span class="hint">' + icon('tap') + 'Toca para ver la pregunta</span>' +
          '</div>' +
          '<div class="face face-back"' + (state.flipped ? '' : ' aria-hidden="true"') + '>' +
            '<span class="topic-tag">' + (t ? t.icon + ' ' : '') + esc(topicName(round.topic)) + '</span>' +
            '<p class="question">' + esc(round.question.text) + '</p>' + answer +
          '</div>' +
        '</div>' +
      '</button>';

    var actions = '';
    if (state.flipped){
      if (state.answerShown || !round.question.answer){
        actions = round.empty
          ? '<div class="actions"><button type="button" class="btn btn-secondary btn-block" data-action="trivia-skip">Siguiente</button></div>'
          : '<div class="actions two">' +
              '<button type="button" class="btn btn-danger" data-action="trivia-wrong">' + icon('x') + 'Falló</button>' +
              '<button type="button" class="btn btn-success" data-action="trivia-correct">' + icon('check') + 'Acertó</button>' +
            '</div>';
      } else {
        actions = '<div class="actions"><button type="button" class="btn btn-secondary btn-block" data-action="show-answer">Mostrar respuesta</button></div>';
      }
    }
    return bar + renderRail() + status + '<div class="stage">' + card + '</div>' + actions;
  }

  function renderRosco(r){
    var c = roscoCounts(r);
    var letters = r.questions.map(function(q, i){
      var cls = q.status === 'correct' ? ' correct' : q.status === 'error' ? ' error' : '';
      if (i === r.currentIndex && q.status === 'pending') cls += ' current';
      return '<span class="rosco-letter' + cls + '" style="--a:' + (i / r.questions.length * 360 - 90) + 'deg">' + q.letter + '</span>';
    }).join('');
    return '<div class="rosco" role="img" aria-label="Rosco: ' + c.correct + ' aciertos, ' + c.error + ' errores, ' + c.pending + ' pendientes">' + letters +
      '<div class="rosco-center"><span class="muted">Turno de</span><span class="who">' + esc(state.players[state.turn].name) + '</span><span class="muted">' + formatTime(state.playerTimers[state.turn]) + ' restantes</span></div>' +
    '</div>' +
    '<div class="tally"><span class="ok">' + icon('check') + c.correct + ' aciertos</span><span class="ko">' + icon('x') + c.error + ' errores</span><span>' + c.pending + ' pendientes</span></div>';
  }

  function renderPasapalabraPlay(){
    var bar = topbar({ back: 'leave-game', backLabel: 'Salir de la partida', pill: 'Pasapalabra' });
    var allFinished = state.roscos.every(function(r){ return r.finished; });
    if (allFinished){
      var board = state.roscos.map(function(r, i){
        return { name: state.players[i].name, correct: roscoCounts(r).correct, time: state.playerTimers[i] };
      }).sort(function(a, b){ return b.correct - a.correct || b.time - a.time; });
      var list = '<ol class="scoreboard">' + board.map(function(p, i){
        return '<li><span class="rank">' + (i + 1) + '</span><span>' + esc(p.name) + '</span><span>' + p.correct + ' ✓</span><span class="muted">' + formatTime(p.time) + '</span></li>';
      }).join('') + '</ol>';
      var tied = board.length > 1 && board[1].correct === board[0].correct && board[1].time === board[0].time;
      return bar + resultCard(tied ? '¡Empate!' : '¡' + esc(board[0].name) + ' gana!', 'Marcador final', list);
    }
    var r = state.roscos[state.turn];
    var q = r.questions[r.currentIndex];
    var time = state.playerTimers[state.turn];
    if (!r.active){
      return bar + renderRail() + renderRosco(r) +
        '<div class="actions" style="margin-top:20px;"><button type="button" class="btn btn-primary btn-block" data-action="pasa-start">' +
          (roscoCounts(r).pending === 26 ? 'Empezar turno de ' : 'Continuar con ') + esc(state.players[state.turn].name) + '</button>' +
        '<p class="cta-hint">Pásale el teléfono a quien va a leer las definiciones.</p></div>';
    }
    return bar +
      '<div class="pasa-head">' +
        '<div class="big-letter" aria-label="Letra ' + q.letter + '">' + q.letter + '</div>' +
        '<div style="text-align:right;"><div class="timer' + (time <= 10 ? ' is-low' : '') + '" role="timer">' + formatTime(time) + '</div>' +
        '<div class="section-meta">' + esc(state.players[state.turn].name) + '</div></div>' +
      '</div>' +
      '<div class="pasa-card">' +
        '<p class="question">' + esc(q.text) + '</p>' +
        '<div class="answer"><div class="answer-label">Respuesta · solo para quien lee</div><div class="answer-text">' + esc(q.answer) + '</div></div>' +
      '</div>' +
      '<div class="actions three">' +
        '<button type="button" class="btn btn-danger" data-action="pasa-error">' + icon('x') + 'Error</button>' +
        '<button type="button" class="btn btn-secondary" data-action="pasa-pasapalabra">' + icon('redo') + 'Pasapalabra</button>' +
        '<button type="button" class="btn btn-success" data-action="pasa-acerto">' + icon('check') + 'Acierto</button>' +
      '</div>';
  }

  function renderPlay(){
    app.innerHTML = '<section class="screen">' +
      (state.selectedMode === 'pasapalabra' ? renderPasapalabraPlay() : renderTriviaPlay()) +
    '</section>';
  }

  /* ---------------- render + foco ---------------- */
  // render() reemplaza #app entero: si el control enfocado (ej. el campo de
  // jugador) tiene un equivalente en el DOM nuevo, se vuelve a enfocar para
  // que el teclado del teléfono no se cierre.
  function focusSelectorFor(el){
    if (!el || el === app || !app.contains(el)) return null;
    if (el.id) return '#' + el.id;
    var action = el.getAttribute('data-action');
    if (!action) return null;
    var sel = '[data-action="' + action + '"]';
    ['data-field', 'data-topic', 'data-idx', 'data-mode'].forEach(function(attr){
      var v = el.getAttribute(attr);
      if (v !== null) sel += '[' + attr + '="' + v.replace(/"/g, '\\"') + '"]';
    });
    return sel;
  }
  function render(){
    var refocus = focusSelectorFor(document.activeElement);
    if (state.screen === 'home') renderHome();
    else if (state.screen === 'setup') renderSetup();
    else if (state.screen === 'ajustes') renderAjustes();
    else renderPlay();
    if (refocus){
      var target = app.querySelector(refocus);
      if (target) target.focus();
    }
  }

  // Cambio de pantalla: transición nativa si existe, y foco a la vista nueva
  // para que teclado y VoiceOver no queden en un botón que ya no existe.
  var reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function go(screen){
    if (state.screen === 'play' && screen !== 'play') stopRoscoTimer();
    state.screen = screen;
    var hadFocus = app.contains(document.activeElement);
    function focusView(){ if (hadFocus && !app.contains(document.activeElement)) app.focus(); }
    if (document.startViewTransition && !(reduceMotion && reduceMotion.matches)){
      document.startViewTransition(render).finished.finally(focusView);
    } else {
      render();
      focusView();
    }
  }

  function startGame(){
    state.turn = 0;
    state.round = 1;
    state.flipped = false;
    state.answerShown = false;
    if (state.selectedMode === 'cultura'){
      state.triviaScores = state.players.map(function(){
        var s = {};
        state.selectedTopics.forEach(function(k){ s[k] = 0; });
        return s;
      });
      state.triviaBadges = state.players.map(function(){ return []; });
      state.triviaLives = state.players.map(function(){ return 100; });
      state.history = {};
      refillTriviaTopicQueues();
      state.triviaRound = null;
      state.triviaWinner = null;
    } else {
      var picks = pickPasapalabraWords(LETTERS, state.players.length);
      state.roscos = state.players.map(function(_, p){
        return {
          questions: LETTERS.map(function(l){ var q = picks[l][p]; return { letter: l, text: q.text, answer: q.answer, status: 'pending' }; }),
          currentIndex: 0, active: false, finished: false
        };
      });
      var time = Number(state.settings.pasapalabraTime) || 120;
      state.playerTimers = state.players.map(function(){ return time; });
    }
    go('play');
  }

  /* ---------------- eventos ---------------- */
  app.addEventListener('submit', function(e){
    var form = e.target.getAttribute('data-form');
    if (!form) return;
    e.preventDefault();
    if (form === 'add-player'){
      var input = document.getElementById('player-input');
      var name = input && input.value.trim();
      if (!name) return;
      state.players.push({ name: name, color: AVATAR_COLORS[state.players.length % AVATAR_COLORS.length] });
      render();
    } else if (form === 'truco'){
      var key = (document.getElementById('truco-input').value || '').trim().toLowerCase().replace(/\s+/g, '');
      state.modoHistoria = key === 'historia' || key === 'modohistoria';
      state.modoPapu = key === 'papu' || key === 'modopapu';
      state.trucoMensaje = state.modoHistoria ? 'Modo Historia activado.' : state.modoPapu ? 'Modo Papu activado.' : 'Clave no reconocida.';
      render();
    }
  });

  app.addEventListener('change', function(e){
    var t = e.target;
    var action = t.getAttribute('data-action');
    if (action === 'set-setting'){
      var field = t.getAttribute('data-field');
      var v = Math.round(Number(t.value));
      var min = Number(t.min), max = Number(t.max);
      if (Number.isFinite(v)) state.settings[field] = Math.min(max, Math.max(min, v));
      t.value = state.settings[field];
    } else if (action === 'toggle-topic'){
      var topic = t.getAttribute('data-topic');
      if (t.checked && state.selectedTopics.length < MAX_TOPICS) state.selectedTopics.push(topic);
      else if (!t.checked) state.selectedTopics = state.selectedTopics.filter(function(k){ return k !== topic; });
      render();
    }
  });

  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t || t.tagName === 'INPUT') return;
    var action = t.getAttribute('data-action');

    if (action === 'select-mode'){
      state.selectedMode = t.getAttribute('data-mode');
      go('setup');
    }
    else if (action === 'go-home'){ go('home'); }
    else if (action === 'open-ajustes'){ go('ajustes'); }
    else if (action === 'close-ajustes'){ go('setup'); }
    else if (action === 'remove-player'){
      state.players.splice(Number(t.getAttribute('data-idx')), 1);
      state.players.forEach(function(p, i){ p.color = AVATAR_COLORS[i % AVATAR_COLORS.length]; });
      render();
    }
    else if (action === 'start'){ if (canStart()) startGame(); }
    else if (action === 'leave-game'){
      if (confirm('¿Salir de la partida? Se perderá el progreso.')) go('setup');
    }
    else if (action === 'play-again'){ startGame(); }
    // trivia
    else if (action === 'trivia-reveal'){
      if (state.flipped) return;
      state.flipped = true;
      state.answerShown = false;
      render();
    }
    else if (action === 'show-answer'){ state.answerShown = true; render(); }
    else if (action === 'trivia-correct'){ advanceTriviaTurn(true); }
    else if (action === 'trivia-wrong'){ advanceTriviaTurn(false); }
    else if (action === 'trivia-skip'){ state.triviaRound = null; state.flipped = false; render(); }
    // pasapalabra
    else if (action === 'pasa-start'){ startRoscoTimer(); render(); }
    else if (action === 'pasa-acerto'){
      var r = state.roscos[state.turn];
      r.questions[r.currentIndex].status = 'correct';
      if (!checkRoscoEnd()){ advanceRoscoIndex(); render(); }
      else nextRoscoPlayer();
    }
    else if (action === 'pasa-error' || action === 'pasa-pasapalabra'){
      var r2 = state.roscos[state.turn];
      r2.questions[r2.currentIndex].status = action === 'pasa-error' ? 'error' : 'pending';
      if (action === 'pasa-error') checkRoscoEnd();
      nextRoscoPlayer();
    }
  });

  render();
})();
</script>
</body>
</html>
