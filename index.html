<title>Copetapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#150C2B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    color-scheme: dark;
    --ink:#150C2B;
    --ink-2:#1E1240;
    --surface:#211539;
    --surface-2:#2C1B4C;
    --line: rgba(248,244,255,.12);
    --line-strong: rgba(248,244,255,.22);
    --pink:#FF3D8F;
    --pink-deep:#93104F;
    --lime:#D8FF3E;
    --lime-deep:#8FB000;
    --cyan:#2FE6C4;
    --cyan-deep:#0E9A7F;
    --violet:#8B5CF6;
    --violet-deep:#4E2FA9;
    --cloud:#F8F4FF;
    --muted:#B6A6DA;

    --cat-nunca-1: var(--violet);      --cat-nunca-2: #5B3FD6;
    --cat-juegos-1: var(--cyan);       --cat-juegos-2: #12B596;
    --cat-cultura-1: var(--lime);      --cat-cultura-2: #A8D61E;
    --cat-trago-1: var(--pink);        --cat-trago-2: var(--violet);
    --cat-regala-1: var(--cyan);       --cat-regala-2: var(--lime);
    --cat-evento-1: var(--pink);       --cat-evento-2: var(--lime); --cat-evento-3: var(--cyan);
    --cat-impostor-word-1: var(--lime); --cat-impostor-word-2: #A8D61E;
    --cat-impostor-spy-1: var(--pink);  --cat-impostor-spy-2: #93104F;
    --cat-incomoda-1: #40E0D0;          --cat-incomoda-2: #008B8B;

    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    --font-body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-gothic: "Century Gothic", Futura, var(--font-display);

    --text-xs: 11px; --text-sm: 13px; --text-base: 15px; --text-lg: clamp(17px, 4.6vw, 19px);
    --text-xl: clamp(26px, 8vw, 32px); --text-display: clamp(30px, 9.5vw, 38px);

    --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 26px;
    --shadow-sm: 0 2px 8px -2px rgba(9,4,24,.35);
    --shadow-md: 0 10px 24px -10px rgba(9,4,24,.5);
    --shadow-card: 0 24px 48px -20px rgba(9,4,24,.65), 0 2px 10px -2px rgba(9,4,24,.4);
    --ease-spring: cubic-bezier(.22,1.12,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background: radial-gradient(120% 60% at 50% -10%, var(--surface-2), var(--ink) 55%);
    color:var(--cloud);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    position:relative;
  }

  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .blob{ position:fixed; border-radius:50%; filter: blur(78px); opacity:.28; pointer-events:none; z-index:0; will-change:transform; }
  .blob-a{ width:60vw; height:60vw; max-width:420px; max-height:420px; background:var(--pink); top:-14%; left:-18%; }
  .blob-b{ width:55vw; height:55vw; max-width:380px; max-height:380px; background:var(--cyan); bottom:-16%; right:-16%; }
  .blob-c{ width:40vw; height:40vw; max-width:300px; max-height:300px; background:var(--violet); bottom:22%; left:-8%; opacity:.2; }
  @media (prefers-reduced-motion: no-preference){
    .blob-a{ animation: float-a 22s ease-in-out infinite; }
    .blob-b{ animation: float-b 26s ease-in-out infinite; }
    .blob-c{ animation: float-c 19s ease-in-out infinite; }
  }
  @keyframes float-a{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(6vw,5vh) scale(1.08);} }
  @keyframes float-b{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-5vw,-6vh) scale(1.06);} }
  @keyframes float-c{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(4vw,-4vh);} }

  .app-shell{
    position:relative; z-index:1;
    width:100%; max-width:480px; margin:0 auto;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: max(22px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }

  .app{ flex:1; }

  .setup-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ font-family: var(--font-display); font-weight:900; letter-spacing:-.025em; font-size:var(--text-display); line-height:1;
    background: linear-gradient(100deg, var(--pink), var(--lime) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 18px rgba(255,61,143,.22)); }
  .section-label{ font-family:var(--font-display); font-weight:700; font-size:var(--text-xs); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin: 24px 0 10px; display:flex; align-items:center; gap:6px; }
  .section-label .count{ font-family:var(--font-mono); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--cloud); font-weight:500; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums; }

  button{ font: inherit; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  button:active{ transform:scale(.96); }
  button, .switch .thumb, .chip{ transition: transform .15s var(--ease-spring), background-color .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease; }

  .player-form{ display:flex; gap:8px; margin-top:8px; }
  .player-form input{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:12px 14px; color:var(--cloud); font-size:16px; font-family:var(--font-body);
    transition: border-color .18s ease, background-color .18s ease;
  }
  .player-form input::placeholder{ color:var(--muted); }
  .player-form input:focus-visible{ outline:2px solid var(--pink); outline-offset:1px; border-color:var(--pink); }
  .add-btn{
    width:46px; height:46px; border-radius:var(--r-sm); border:none; flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-sm);
  }
  .add-btn:active{ transform:scale(.92) rotate(-4deg); }
  .add-btn:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }

  .players-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{
    display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line);
    border-radius:24px; padding:6px 10px 6px 6px; font-size:14px;
    animation: chip-in .3s var(--ease-spring) both;
  }
  @media (prefers-reduced-motion: no-preference){
    @keyframes chip-in{ 0%{ opacity:0; transform:scale(.7); } 100%{ opacity:1; transform:scale(1); } }
  }
  .chip:hover{ border-color:var(--line-strong); }
  .chip .avatar{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink); flex-shrink:0; }
  .chip button{ background:none; border:none; color:var(--muted); font-size:15px; line-height:1; padding:2px; }
  .chip button:focus-visible{ outline:2px solid var(--pink); border-radius:50%; }
  .empty-hint{ font-size:13px; color:var(--muted); margin-top:10px; }

  .mode-card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); padding:14px; margin-bottom:10px; box-shadow: var(--shadow-sm);
  }
  .mode-icon{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .mode-copy{ flex:1; min-width:0; }
  .mode-copy strong{ display:block; font-size:15px; }
  .mode-copy span{ display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }

  .drink-config{ display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:6px 14px; box-shadow:var(--shadow-sm); }
  .drink-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .drink-row:last-child{ border-bottom:none; }
  .drink-row span{ font-size:13.5px; color:var(--cloud); }
  .drink-input{
    width:56px; flex-shrink:0; text-align:center; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:8px 4px; color:var(--cloud); font-family:var(--font-mono); font-size:15px;
    font-variant-numeric:tabular-nums; transition:border-color .18s ease;
  }
  .drink-input:focus-visible{ outline:2px solid var(--pink); outline-offset:1px; border-color:var(--pink); }

  .switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
  .switch .track{ position:absolute; inset:0; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); transition:background .25s ease; }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--cloud); transition:transform .28s var(--ease-spring); box-shadow:0 2px 4px rgba(0,0,0,.3); }
  .switch input:checked + .track{ background:var(--cyan); }
  .switch input:checked + .track + .thumb{ transform:translateX(20px); }

  .segmented{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:4px; gap:4px; }
  .segmented button{
    flex:1; border:none; background:transparent; color:var(--muted); font-family:var(--font-body); font-weight:600;
    font-size:14px; padding:10px 0; border-radius:10px; transition:background .18s ease, color .18s ease, transform .15s var(--ease-spring);
  }
  .segmented button.active{ background: linear-gradient(135deg, var(--pink), var(--violet)); color:#fff; box-shadow: var(--shadow-sm); }
  .card-copy{ font-size:12.5px; color:var(--muted); margin-top:8px; }

  .start-btn{
    width:100%; margin-top:26px; border:none; border-radius:var(--r-md); padding:17px;
    font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--ink);
    background: linear-gradient(100deg, var(--lime), var(--cyan));
    box-shadow: 0 14px 28px -10px rgba(216,255,62,.45);
    transition: transform .15s var(--ease-spring), box-shadow .2s ease, opacity .2s ease;
  }
  .start-btn:disabled{ opacity:.35; box-shadow:none; }
  .start-hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }

  .welcome-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; padding:20px; }
  .welcome-btn{ width:100%; max-width:320px; }

  .mode-blocks{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:440px; margin-top:8px; }
  .mode-block{ display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; text-align:left; box-shadow:var(--shadow-sm); transition:transform .15s var(--ease-spring), border-color .18s ease, box-shadow .18s ease; }
  .mode-block-icon{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .mode-block[data-mode="pre"] .mode-block-icon{ background:radial-gradient(circle at 30% 30%, var(--cyan), var(--cyan-deep)); }
  .mode-block[data-mode="disco"] .mode-block-icon{ background:conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--lime), var(--pink)); }
  .mode-block[data-mode="cultura"] .mode-block-icon{ background:radial-gradient(circle at 30% 30%, var(--lime), var(--lime-deep)); }
  .mode-block-info{ flex:1; min-width:0; }
  .mode-block-info strong{ display:block; font-size:16px; margin-bottom:2px; }
  .mode-block-info span{ font-size:13px; color:var(--muted); line-height:1.3; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
  .icon-btn{ width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--cloud); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .round-badge{ font-family:var(--font-mono); font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-variant-numeric:tabular-nums; }
  .mode-flags{ display:flex; gap:6px; }
  .mode-flags span{ width:30px; height:30px; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; opacity:.3; }
  .mode-flags span.on{ opacity:1; transform:scale(1.05); }

  .rail{ display:flex; gap:10px; overflow-x:auto; padding:16px 2px 6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .rail::-webkit-scrollbar{ display:none; }
  .rail-player{ display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; opacity:.5; scroll-snap-align:center; }
  .rail-player.current{ opacity:1; transform:scale(1.1); }
  .rail-player .avatar{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--ink); }
  .rail-player.current .avatar{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--pink), 0 0 14px -2px var(--pink); }
  .rail-player small{ font-size:10px; color:var(--muted); max-width:44px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .stage-wrap{ margin-top:18px; perspective:1200px; }
  .turn-glow{ font-family:var(--font-display); font-weight:700; font-size:13px; color:#fff; background:rgba(0,0,0,.28); padding:4px 14px; border-radius:20px; margin-bottom:10px; box-shadow:0 0 10px rgba(255,255,255,.45); }
  .turn-glow-name{ font-family:var(--font-mono); font-weight:800; text-transform:uppercase; }

  .flip-card{ position:relative; width:100%; aspect-ratio:3/3.9; margin-top:16px; transform-style:preserve-3d; transition:transform .65s cubic-bezier(.2,.9,.25,1); filter:drop-shadow(var(--shadow-card)); }
  .flip-card.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius:var(--r-xl); backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; overflow-y:auto; scrollbar-width:none; }
  .face::-webkit-scrollbar{ display:none; }
  .face-front{ background: radial-gradient(120% 100% at 50% 0%, var(--surface-2), var(--surface)); border:1px solid var(--line); }
  .face-front .mark{ font-family:var(--font-display); font-size:46px; font-weight:900; color:var(--muted); opacity:.45; }
  .face-front .tap-hint{ margin-top:10px; font-size:13px; color:var(--muted); font-weight:600; }
  .face-back{ transform:rotateY(180deg); color:var(--ink); }
  .face-back.cat-nunca{ background: linear-gradient(160deg, var(--cat-nunca-1), var(--cat-nunca-2)); color:#fff; }
  .face-back.cat-juegos{ background: linear-gradient(160deg, var(--cat-juegos-1), var(--cat-juegos-2)); }
  .face-back.cat-cultura{ background: linear-gradient(160deg, var(--cat-cultura-1), var(--cat-cultura-2)); }
  .face-back.cat-trago{ background: linear-gradient(155deg, var(--cat-trago-1), var(--cat-trago-2)); color:#fff; }
  .face-back.cat-regala{ background: linear-gradient(155deg, var(--cat-regala-1), var(--cat-regala-2)); }
  .face-back.cat-evento{ background: linear-gradient(120deg, var(--cat-evento-1), var(--cat-evento-2) 55%, var(--cat-evento-3)); }
  .face-back.cat-espia-word{ background: linear-gradient(160deg, var(--cat-impostor-word-1), var(--cat-impostor-word-2)); }
  .face-back.cat-espia-spy{ background: linear-gradient(160deg, var(--cat-impostor-spy-1), var(--cat-impostor-spy-2)); color:#fff; }
  .face-back.cat-papu{ background: linear-gradient(160deg, var(--pink), var(--pink-deep)); color:#fff; }
  .face-back.cat-incomoda{ background: linear-gradient(160deg, var(--cat-incomoda-1), var(--cat-incomoda-2)); color:#fff; }

  .cat-badge{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; background:rgba(0,0,0,.18); padding:5px 11px; border-radius:20px; }
  .cat-emoji{ font-size:34px; margin-top:14px; }
  .challenge-text{ font-family:var(--font-gothic); font-weight:700; text-transform:uppercase; font-size:var(--text-lg); margin-top:12px; line-height:1.3; }
  .challenge-sub{ font-family:var(--font-body); font-weight:500; font-size:var(--text-sm); margin-top:10px; line-height:1.5; opacity:.85; }
  .game-topic{ font-family:var(--font-display); font-weight:700; font-size:var(--text-base); margin-top:8px; padding:8px 14px; background:rgba(255,255,255,.1); border-radius:var(--r-sm); text-align:center; }
  .answer-block{ margin-top:14px; padding-top:14px; border-top:1px dashed rgba(0,0,0,.2); }
  .player-life{ display:flex; align-items:center; gap:4px; font-size:11px; font-family:var(--font-mono); font-weight:700; padding:2px 8px; border-radius:12px; background:rgba(255,255,255,.1); }
  .player-life.eliminated{ background:rgba(255,61,143,.2); color:var(--pink); }
  .rail-player.eliminated{ opacity:.4; }
  .rail-player.eliminated .avatar{ opacity:.3; filter:grayscale(1); }

  .play-actions{ display:grid; gap:9px; margin-top:18px; }
  .play-actions.hidden{ display:none; }
  .btn-primary{ border:none; border-radius:var(--r-md); padding:15px; font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--ink); background:linear-gradient(100deg, var(--lime), var(--cyan)); box-shadow:var(--shadow-sm); }
  .btn-ghost{ border:1px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:13px; font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--cloud); }
  .tap-target{ background:none; border:none; padding:0; width:100%; display:block; }
  .rosco-letter { font-family:var(--font-display); font-size:86px; font-weight:900; color:var(--cyan); text-align:center; line-height:1; margin-bottom:4px; }
  .rosco-timer { font-family:var(--font-mono); font-size:38px; font-weight:700; color:var(--lime); text-align:center; margin-bottom:14px; }
  .rosco-actions { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:8px; margin-top:20px; }
  .rosco-actions button { padding:14px 4px; font-weight:800; border-radius:var(--r-sm); border:none; font-family:var(--font-display); font-size:14px; }
  .btn-acerto { background:var(--lime); color:var(--ink); }
  .btn-pasa { background:var(--cyan); color:var(--ink); }
  .btn-error { background:var(--pink); color:#fff; }
  .trivia-topics{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .trivia-topic{ position:relative; display:flex; align-items:center; gap:8px; min-height:58px; padding:10px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); color:var(--cloud); text-align:left; cursor:pointer; }
  .trivia-topic input{ position:absolute; opacity:0; pointer-events:none; }
  .trivia-topic:has(input:checked){ border-color:var(--topic-color); background:color-mix(in srgb, var(--topic-color) 24%, var(--surface)); box-shadow:0 0 0 1px var(--topic-color); }
  .trivia-topic-icon{ font-size:23px; }
  .trivia-topic-name{ font-size:12px; font-weight:700; }
  .trivia-topic-count{ display:block; color:var(--muted); font-size:10px; font-weight:400; margin-top:2px; }
  .trivia-badges{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:4px; }
  .trivia-badge{ border-radius:10px; padding:3px 7px; font-size:10px; color:var(--ink); font-weight:800; }
  .trivia-question-card{ margin-top:18px; background:radial-gradient(120% 100% at 50% 0%, var(--surface-2), var(--surface)); border:1px solid var(--line); border-radius:var(--r-xl); padding:24px 20px; box-shadow:var(--shadow-card); text-align:center; }
  .trivia-question-card .challenge-text{ margin-top:18px; }
  .trivia-question-card .answer-block{ width:100%; }
  .trivia-verdict{ display:grid; grid-template-columns:1fr 1fr; gap:9px; width:100%; margin-top:18px; }
  .trivia-verdict button{ min-height:48px; border:none; border-radius:var(--r-md); font-family:var(--font-display); font-size:14px; font-weight:800; box-shadow:var(--shadow-sm); }
  .trivia-verdict .btn-error{ background:linear-gradient(135deg,var(--pink),var(--pink-deep)); color:#fff; }
  .trivia-verdict .btn-acerto{ background:linear-gradient(135deg,var(--lime),var(--cyan)); color:var(--ink); }
  .trivia-card-back{ color:var(--cloud); text-shadow:0 2px 8px rgba(9,4,24,.5); }
  .trivia-card-back .cat-badge{ background:rgba(0,0,0,.24); color:var(--cloud); text-shadow:none; }
  .trivia-card-back .challenge-text{ color:var(--cloud); }
  .trivia-card-back .challenge-sub{ color:var(--cloud); }
  .trivia-card-back .answer-block{ border-top-color:rgba(248,244,255,.35); }
</style>

<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>

<div class="app-shell">
  <div class="app" id="app"></div>
</div>

<script src="data/deck.js"></script>
<script src="data/eventos.js"></script>
<script src="data/espiapalabras.js"></script>
<script src="data/pasapalabra.js"></script>
<script>
  (function(){
    var AVATAR_COLORS = ['var(--pink)','var(--lime)','var(--cyan)','var(--violet)'];

    var EVENTOS_ALEATORIOS = window.EVENTOS_ALEATORIOS || [];
    var DECK = window.DECK || {};
    var ESPIA_WORDS = window.ESPIA_WORDS || { normal: [], futbol: [] };
    var PASAPALABRA_WORDS = window.PASAPALABRA_WORDS || {};

    function initSpecials(){
      return {
        cardsDrawn: 0,
        greetingShown: false,
        opusShown: false,
        timeoutShown: false,
        bookerShown: false,
        espejitoShown: false,
        nextCascada: 22,
        reyKCount: 0,
        reyKNextEligible: 20
      };
    }

    var state = {
      players: [],
      futbol: false,
      disco: false,
      culturaEnabled: true,
      includeCulturaInPre: false,
      modoAmigos: false,
      modoHistoria: false,
      modoPapu: false,
      trucoMensaje: '',
      drinkConfig: { greeting: 4, eventMin: 2, eventMax: 4, nuncaMin: 2, nuncaMax: 3, maxDrinks: 5, culturaDamage: 20, pasapalabraTime: 120 },
      cards: null,
      screen: 'welcome',
      selectedMode: null,
      selectedTopics: [],
      triviaScores: [],
      triviaBadges: [],
      triviaTopicQueues: [],
      triviaRound: null,
      triviaWinner: null,
      triviaLives: [],
      turn: 0,
      round: 1,
      flipped: false,
      card: null,
      answerShown: false,
      espia: null,
      wordDrop: null,
      naming: null,
      lastCategory: null,
      history: {},
      specials: initSpecials(),
      playerLives: [],
      culturaEliminated: []
    };

    var app = document.getElementById('app');

    function initials(name){ return name.trim().slice(0,1).toUpperCase(); }
    function esc(s){ return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function canStart(){ return state.players.length >= 2 && (state.selectedMode === 'cultura' ? state.selectedTopics.length >= 1 : state.cards !== null); }

    function isCompetitiveTrivia(){ return state.selectedTopics.length >= 4; }

    function shuffle(arr){
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    function toEntry(item){
      return (typeof item === 'string') ? { text: item, answer: null } : item;
    }

    function saveHistoryToStorage(){
      try { localStorage.setItem('copete_history', JSON.stringify(state.history)); } catch(e){}
    }

    function identityOf(item){
      if (typeof item === 'string') return item;
      if (item.text !== undefined) return item.text;
      if (item.name !== undefined) return item.name;
      return JSON.stringify(item);
    }

    function pickWithHistory(historyKey, weightedEntries){
      var used = state.history[historyKey] || (state.history[historyKey] = []);
      var avail = weightedEntries.filter(function(e){ return used.indexOf(identityOf(e.item)) === -1; });
      if (avail.length === 0){ used.length = 0; avail = weightedEntries; }
      var total = avail.reduce(function(sum, e){ return sum + e.w; }, 0);
      var r = Math.random() * total;
      var picked = avail[avail.length - 1].item;
      for (var i = 0; i < avail.length; i++){
        r -= avail[i].w;
        if (r <= 0){ picked = avail[i].item; break; }
      }
      used.push(identityOf(picked));
      saveHistoryToStorage();
      return picked;
    }

    function weightedPick(catKey, cat){
      var entries = [];
      if (cat.items) {
        cat.items.forEach(function(it){ entries.push({ item: toEntry(it), w: (it && typeof it === 'object' && it.weight) || 1 }); });
      }
      if (state.futbol && cat.futbol){
        cat.futbol.forEach(function(it){ entries.push({ item: toEntry(it), w: 1 }); });
      }
      if (cat.disco){
        var discoWeight = state.disco ? 3 : 0.2;
        cat.disco.forEach(function(it){ entries.push({ item: toEntry(it), w: discoWeight }); });
      }
      if (state.modoAmigos && cat.amigos){
        cat.amigos.forEach(function(it){ entries.push({ item: toEntry(it), w: 2 }); });
      }
      return pickWithHistory(catKey, entries);
    }

    function weightedChoice(arr, weightFn){
      var total = arr.reduce(function(sum, it){ return sum + weightFn(it); }, 0);
      var r = Math.random() * total;
      for (var i = 0; i < arr.length; i++){
        r -= weightFn(arr[i]);
        if (r <= 0) return arr[i];
      }
      return arr[arr.length - 1];
    }

    function makeCard(fields){
      return Object.assign({ cat:null, icon:null, text:null, sub:null, answer:null, isSpy:false, special:null, rounds:null, topics:null, image:null }, fields);
    }

    function discoDouble(n){ return state.disco ? Math.min(n * 2, state.drinkConfig.maxDrinks) : n; }

    function weightedRandomInRange(min, max){
      if (max <= min) return min;
      var span = max - min + 1;
      var total = 0, i;
      for (i = 0; i < span; i++) total += (span - i);
      var r = Math.random() * total;
      for (i = 0; i < span; i++){
        r -= (span - i);
        if (r <= 0) return min + i;
      }
      return min;
    }

    function randomDrinkCount(){
      return discoDouble(weightedRandomInRange(state.drinkConfig.eventMin, state.drinkConfig.eventMax));
    }

    function applyDiscoDrinks(text){
      if (!state.disco) return text;
      return text.replace(/^(\d+)(\s*tragos?\s+por\s+cada)/i, function(m, num, rest){
        return discoDouble(parseInt(num, 10)) + rest;
      });
    }

    function randomNuncaDrinks(){
      return discoDouble(weightedRandomInRange(state.drinkConfig.nuncaMin, state.drinkConfig.nuncaMax));
    }

    function resolveEvent(template){
      var turnPlayer = state.players[state.turn];
      var others = state.players.filter(function(p){ return p !== turnPlayer; });
      var p1 = others.length ? others[Math.floor(Math.random() * others.length)] : turnPlayer;
      var remaining = others.filter(function(p){ return p !== p1; });
      var p2 = remaining.length ? remaining[Math.floor(Math.random() * remaining.length)] : p1;

      return applyDiscoDrinks(template
        .replace(/\{jugador1\}/g, p1.name)
        .replace(/\{jugador2\}/g, p2.name)
        .replace(/\{jugador\}/g, turnPlayer.name)
        .replace(/\bX\b/g, function(){ return String(randomDrinkCount()); }));
    }

    var CATEGORY_WEIGHT = { evento: 8, nunca: 1, cultura: 0.5, trago: 1, regala: 1, juegos: 2 };
    var DISABLED_CATEGORIES = ['regala'];

    function activeCategoryKeys(){
      var mode = state.selectedMode;
      if (state.modoHistoria) return ['historia'];
      if (state.modoPapu) return ['papu'];
      if (mode === 'cultura') return ['cultura'];
      if (mode === 'disco'){
        var keys = ['evento', 'trago', 'juegos'];
        if (state.culturaEnabled) keys.push('cultura');
        return keys;
      }
      return Object.keys(DECK).filter(function(k){
        if (DISABLED_CATEGORIES.indexOf(k) !== -1) return false;
        if (k === 'trago' && !state.futbol) return false;
        if (k === 'cultura' && !state.culturaEnabled) return false;
        return true;
      });
    }

    var SPECIAL_CARD_META = {
      greeting: { label: '¡Salud!' },
      opus: { label: 'OPUS' },
      cascada: { label: 'Cascada' },
      timeout: { label: 'TIMEOUT' },
      booker: { label: 'Booker T' },
      'rey-k': { label: 'Rey K' },
      espejito: { label: 'Espejito' }
    };
    var SPECIAL_EVENTS = {
      opus: { minCard: 20, chance: 0.35 },
      timeout: { minCard: 28, chance: 0.35 },
      booker: { minCard: 30, chance: 0.35 },
      cascada: { every: 22 },
      espejito: { minCard: 15, chance: 0.35 }
    };
    var REY_K_ORDINALES = ['Primer', 'Segundo', 'Tercer', 'Cuarto'];
    var REY_K_PREGUNTAS = ['¿Cómo se mata?', '¿Dónde se mata?', '¿Con quién se mata?', '¡Se acabó! Todos matan la piscola o el trago'];
    var REY_K_PALOS = ['♠', '♥', '♦', '♣'];

    function buildReyKCard(n){
      return makeCard({
        cat: 'evento', icon: '👑',
        text: REY_K_ORDINALES[n-1] + ' Rey ' + REY_K_PALOS[(n-1) % REY_K_PALOS.length],
        sub: REY_K_PREGUNTAS[n-1],
        special: 'rey-k'
      });
    }

    function scheduleTimeoutAlarm(){
      setTimeout(function(){
        var banner = document.createElement('div');
        banner.className = 'timeout-banner';
        banner.innerHTML = '<span>⏱️ ¡TIMEOUT! Vasos vacíos</span>';
        var closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', function(){ banner.remove(); });
        banner.appendChild(closeBtn);
        document.body.appendChild(banner);
      }, 5 * 60 * 1000);
    }

    function drawChallenge(){
      var sp = state.specials;

      if (state.modoHistoria || state.modoPapu){
        var secretKey = state.modoHistoria ? 'historia_geografia' : 'papu';
        var secretCat = DECK.trivia[secretKey] || DECK.trivia.cine;
        var secretEntries = secretCat.questions.map(function(item){ return { item: toEntry(item), w: 1 }; });
        var secretEntry = pickWithHistory(secretKey, secretEntries);
        state.card = makeCard({ cat: secretKey, icon: secretCat.icon, text: secretEntry.text, answer: secretEntry.answer || null });
        return;
      }

      if (state.selectedMode === 'cultura'){
        var cat = DECK.cultura;
        var entry = weightedPick('cultura', cat);
        var cardText = entry.text;
        state.card = makeCard({ cat: 'cultura', icon: cat.icon, text: cardText, answer: entry.answer || null, special: entry.special || null });
        return;
      }

      if (!sp.greetingShown){
        sp.greetingShown = true;
        state.card = makeCard({ cat: 'evento', icon: '🥂', text: 'Para empezar, todos ' + discoDouble(state.drinkConfig.greeting) + ' tragos', special: 'greeting' });
        return;
      }

      sp.cardsDrawn++;

      if (sp.reyKCount < 4 && sp.cardsDrawn >= sp.reyKNextEligible && Math.random() < 0.25){
        sp.reyKCount++;
        sp.reyKNextEligible = sp.cardsDrawn + 20;
        state.card = buildReyKCard(sp.reyKCount);
        return;
      }

      var opusCfg = SPECIAL_EVENTS.opus;
      if (!sp.opusShown && sp.cardsDrawn >= opusCfg.minCard && Math.random() < opusCfg.chance){
        sp.opusShown = true;
        state.card = makeCard({ cat: 'evento', icon: '💿', text: 'OPUS', special: 'opus' });
        return;
      }

      var espCfg = SPECIAL_EVENTS.espejito;
      if (!sp.espejitoShown && sp.cardsDrawn >= espCfg.minCard && Math.random() < espCfg.chance){
        sp.espejitoShown = true;
        state.card = makeCard({ cat: 'evento', icon: '🪞', text: 'Espejito rebotín', sub: 'La próxima vez que te toque tomar puedes desviar los tragos a alguien más.', special: 'espejito' });
        return;
      }

      var toCfg = SPECIAL_EVENTS.timeout;
      if (!sp.timeoutShown && sp.cardsDrawn >= toCfg.minCard && Math.random() < toCfg.chance){
        sp.timeoutShown = true;
        state.card = makeCard({ cat: 'evento', icon: '⏱️', text: 'TIMEOUT', sub: 'En 5 minutos todos sus vasos deben estar vacíos', special: 'timeout' });
        scheduleTimeoutAlarm();
        return;
      }

      var keys = activeCategoryKeys();
      var candidateKeys = keys.filter(function(k){ return k !== state.lastCategory; });
      if (candidateKeys.length === 0) candidateKeys = keys;
      var catKey = weightedChoice(candidateKeys, function(k){ return CATEGORY_WEIGHT[k] || 1; });
      state.lastCategory = catKey;
      var cat = DECK[catKey];

      if (catKey === 'evento'){
        var eventEntry = EVENTOS_ALEATORIOS[Math.floor(Math.random() * EVENTOS_ALEATORIOS.length)];
        var eventText = resolveEvent(eventEntry);
        state.card = makeCard({ cat: catKey, icon: '🎉', text: eventText });
        return;
      }

      if (catKey === 'juegos'){
        var pool = cat.items.filter(function(g){ return !g.needsCards || state.cards === 'si'; });
        var gameEntries = pool.map(function(g){ return { item: g, w: g.weight || 1 }; });
        var game = pickWithHistory('juegos', gameEntries);
        var gameTopic = (game.topics && game.topics.length) ? game.topics[Math.floor(Math.random() * game.topics.length)] : null;
        state.card = makeCard({ cat: catKey, icon: game.icon, text: game.name, sub: game.rules, isSpy: game.name === 'Impostor', topic: gameTopic });
        return;
      }

      var entry = weightedPick(catKey, cat);
      var cardText = applyDiscoDrinks(entry.text);
      var cardSub = entry.sub || null;
      if (catKey === 'nunca') cardText += ' — el que lo haya hecho toma ' + randomNuncaDrinks();
      state.card = makeCard({ cat: catKey, icon: cat.icon, text: cardText, sub: cardSub, answer: entry.answer || null, special: entry.special || null, rounds: entry.rounds || null, topics: entry.topics || null, image: entry.image || null });
    }

    function resolveEspiaWord(template){
      if (template === '(Uno de los jugadores al azar)'){
        var p = state.players[Math.floor(Math.random() * state.players.length)];
        return p.name;
      }
      if (template.indexOf('(jugador aleatorio)') !== -1){
        var p2 = state.players[Math.floor(Math.random() * state.players.length)];
        return template.replace(/\(jugador aleatorio\)/g, p2.name);
      }
      return template;
    }

    function startEspia(){
      var pool = ESPIA_WORDS.normal.slice();
      if (state.futbol && ESPIA_WORDS.futbol) pool = pool.concat(ESPIA_WORDS.futbol);
      var template = pool[Math.floor(Math.random() * pool.length)];
      var word = resolveEspiaWord(template);
      var order = shuffle(state.players.map(function(_, i){ return i; }));
      var impostorCount = Math.min(state.players.length > 6 ? 2 : 1, order.length);
      var spyIndexes = shuffle(state.players.map(function(_, i){ return i; })).slice(0, impostorCount);
      state.espia = { word: word, spyIndexes: spyIndexes, order: order, step: 0, revealed: false };
    }

    var roscoTimerInterval = null;

    function startRoscoTimer() {
      if (roscoTimerInterval) clearInterval(roscoTimerInterval);
      state.roscos[state.turn].active = true;
      roscoTimerInterval = setInterval(function(){
        if (!state.roscos[state.turn].active) return;
        state.playerTimers[state.turn]--;
        if (state.playerTimers[state.turn] <= 0){
          state.playerTimers[state.turn] = 0;
          state.roscos[state.turn].questions.forEach(function(question){
            if (question.status === 'pending') question.status = 'error';
          });
          checkRoscoEnd();
          nextRoscoPlayer();
        } else {
          var timerElement = document.querySelector('.rosco-timer');
          if (timerElement) timerElement.textContent = state.playerTimers[state.turn] + 's';
          else render();
        }
      }, 1000);
    }

    function stopRoscoTimer() {
      state.roscos[state.turn].active = false;
      if (roscoTimerInterval) clearInterval(roscoTimerInterval);
    }

    function advanceRoscoIndex() {
      var r = state.roscos[state.turn];
      var startIdx = r.currentIndex;
      for (var i = 1; i <= r.questions.length; i++) {
        var idx = (startIdx + i) % r.questions.length;
        if (r.questions[idx].status === 'pending') {
          r.currentIndex = idx;
          return true;
        }
      }
      return false; 
    }

    function checkRoscoEnd() {
      var r = state.roscos[state.turn];
      var pending = r.questions.filter(function(q){ return q.status === 'pending'; }).length;
      if (pending === 0) {
        stopRoscoTimer();
        r.finished = true;
        return true;
      }
      return false;
    }

    function nextRoscoPlayer() {
      stopRoscoTimer();
      advanceRoscoIndex(); 
      var attempts = 0;
      do {
        state.turn = (state.turn + 1) % state.players.length;
        attempts++;
      } while (state.roscos[state.turn].finished && attempts < state.players.length);
      render();
    }

    function renderPasapalabraRosco(r) {
      var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      var center = 50;
      var radius = 43;
      return '<div style="position:relative; width:min(82vw,300px); aspect-ratio:1; margin:6px auto 0; border:2px solid rgba(248,244,255,.18); border-radius:50%;">' +
        letters.map(function(letter, i){
          var angle = (i / letters.length) * Math.PI * 2 - Math.PI / 2;
          var x = center + Math.cos(angle) * radius;
          var y = center + Math.sin(angle) * radius;
          var question = r.questions[i];
          var color = question.status === 'correct' ? 'var(--lime)' : question.status === 'error' ? 'var(--pink)' : 'var(--muted)';
          return '<span style="position:absolute; left:' + x + '%; top:' + y + '%; transform:translate(-50%,-50%); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:' + color + '; background:rgba(21,12,43,.72); font-family:var(--font-display); font-size:12px; font-weight:800;">' + letter + '</span>';
        }).join('') +
        '<span style="position:absolute; inset:35%; display:flex; align-items:center; justify-content:center; color:var(--cloud); font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;">ROSCO</span>' +
      '</div>';
    }

    function renderPasapalabraStage() {
      var allFinished = state.roscos.every(function(r) { return r.finished; });
      if (allFinished) {
        var scoreboard = state.roscos.map(function(rosco, i){
          return {
            name: state.players[i].name,
            correct: rosco.questions.filter(function(question){ return question.status === 'correct'; }).length,
            time: state.playerTimers[i]
          };
        }).sort(function(a, b){ return b.correct - a.correct || b.time - a.time; });
        var scoreboardHtml = scoreboard.map(function(player, i){
          return '<div style="display:grid; grid-template-columns:28px 1fr auto auto; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid rgba(21,12,43,.18); text-align:left;">' +
            '<strong>' + (i + 1) + '.</strong><span>' + esc(player.name) + '</span><span>' + player.correct + ' aciertos</span><span>' + player.time + 's</span>' +
          '</div>';
        }).join('');
        return '<div class="stage-wrap"><div class="face face-back cat-cultura" style="position:static; transform:none; aspect-ratio:auto; min-height:340px; justify-content:flex-start; padding:24px;"><div class="cat-emoji">🏆</div><div class="challenge-text">¡Juego Terminado!</div><div class="challenge-sub" style="margin-bottom:12px;">Marcador final</div><div style="width:100%; font-size:13px;">' + scoreboardHtml + '</div></div><div class="play-actions"><button class="btn-primary" data-action="back-setup">Volver a modos</button></div></div>';
      }
      var r = state.roscos[state.turn];
      var q = r.questions[r.currentIndex];
      var timer = state.playerTimers[state.turn];
      var html = '<div class="stage-wrap"><div class="face face-back cat-juegos" style="position:static; transform:none; aspect-ratio:3/4.2; justify-content:flex-start; padding-top:40px;">';
      html += '<div class="rosco-timer">' + timer + 's</div>';
      html += '<div class="rosco-letter">' + q.letter + '</div>';

      if (!r.active) {
        html += renderPasapalabraRosco(r);
         html += '<div class="challenge-text" style="margin-top:20px;">Turno de ' + esc(state.players[state.turn].name) + '</div>';
         html += '<div class="challenge-sub">Pásale el teléfono.</div>';
         html += '</div><div class="play-actions"><button class="btn-primary" data-action="pasa-start">Empezar / Continuar</button></div></div>';
      } else {
         html += '<div class="challenge-text" style="font-size:16px; margin-top:10px;">' + esc(q.text) + '</div>';
         html += '<div class="challenge-sub" style="font-size:14px; margin-top:12px; opacity:1; color:var(--lime);">Rta: ' + esc(q.answer) + '</div>';
         html += '</div>'; 
         html += '<div class="rosco-actions">';
         html += '<button class="btn-error" data-action="pasa-error">✗ Error</button>';
         html += '<button class="btn-pasa" data-action="pasa-pasapalabra">↻ Pasapalabra</button>';
         html += '<button class="btn-acerto" data-action="pasa-acerto">✓ Acertó</button>';
         html += '</div></div>';
      }
      return html;
    }

    window.addPlayerFromForm = function() {
      var input = document.getElementById('player-input');
      if (input && input.value.trim()) {
        var name = input.value.trim();
        var color = AVATAR_COLORS[state.players.length % AVATAR_COLORS.length];
        state.players.push({ name: name, color: color });
        input.value = '';
        input.focus();
        var countEl = document.querySelector('.section-label .count');
        if (countEl) countEl.textContent = state.players.length;
        var grid = document.querySelector('.players-grid');
        if (grid) {
          grid.insertAdjacentHTML('beforeend', 
            '<div class="chip">' +
              '<span class="avatar" style="background:' + color + '">' + esc(initials(name)) + '</span>' +
              '<span>' + esc(name) + '</span>' +
              '<button data-action="remove-player" data-idx="' + (state.players.length - 1) + '" aria-label="Quitar ' + esc(name) + '">✕</button>' +
            '</div>'
          );
        }
        var emptyHint = document.querySelector('.empty-hint');
        if (emptyHint) emptyHint.remove();
        if (canStart()) {
          var startBtn = document.querySelector('.start-btn');
          if (startBtn) startBtn.removeAttribute('disabled');
          var startHint = document.querySelector('.start-hint');
          if (startHint) startHint.style.display = 'none';
        }
      }
    };

    function triviaQuestionCount(topic){
      return topic.questions.length;
    }

    function renderTriviaTopicPicker(){
      var topics = Object.keys(DECK.trivia);
      return '<div class="section-label" style="margin-top:20px;">Temas de Trivia <span class="count">' + state.selectedTopics.length + '/6</span></div>' +

    function renderModeSelect(){
      app.innerHTML =
        '<div class="welcome-screen">' +
          '<div class="brand">Copetapp</div>' +
          '<div class="section-label" style="margin-top:16px;">Elige un modo</div>' +
          '<div class="mode-blocks">' +
            '<button class="mode-block" data-action="select-mode" data-mode="pre">' +

            '<button class="mode-block" data-action="select-mode" data-mode="cultura">' +

    function renderEspiaStage(){
      var e = state.espia;
      if (e.step >= e.order.length){
        return (
          '<div class="stage-wrap">' +
            '<div class="face face-back cat-juegos" style="position:static; transform:none; aspect-ratio:3/2.2;">' +
              '<span class="cat-badge">Impostor</span><div class="cat-emoji">🎭</div>' +
              '<div class="challenge-text">¡Todos vieron su carta!</div>' +
            '</div>' +
            '<div class="play-actions"><button class="btn-primary" data-action="finish-espia">Listo, siguiente turno</button></div>' +
          '</div>'
        );
      }
      var player = state.players[e.order[e.step]];
      var isSpy = e.spyIndexes.indexOf(e.order[e.step]) !== -1;
      var passGlow = '<div class="turn-glow">Pásale el teléfono a <span class="turn-glow-name">' + esc(player.name) + '</span></div>';
      var backFace = isSpy
        ? '<div class="face face-back cat-espia-spy">' + passGlow + '<span class="cat-badge">Impostor</span><div class="cat-emoji">🎭</div><div class="challenge-text">Eres el Impostor</div></div>'
        : '<div class="face face-back cat-espia-word">' + passGlow + '<span class="cat-badge">Palabra secreta</span><div class="cat-emoji">🔎</div><div class="challenge-text">' + esc(e.word) + '</div></div>';

      return (
        '<div class="stage-wrap">' +
          '<button class="tap-target" data-action="reveal-espia">' +
            '<div class="flip-card ' + (e.revealed ? 'flipped' : '') + '">' +
              '<div class="face face-front">' + passGlow + '<div class="mark">🤫</div><div class="tap-hint">Toca cuando tengas el teléfono</div></div>' +
              backFace +
            '</div>' +
          '</button>' +
          '<div class="play-actions ' + (e.revealed ? '' : 'hidden') + '"><button class="btn-primary" data-action="next-espia-step">Listo</button></div>' +
        '</div>'
      );
    }

    function renderCulturaElimination(turnGlowHtml, topbar, rail){
      var meta = DECK.cultura || { label: 'Cultura', cls: 'cat-cultura' };
      var aliveIndexes = state.players.map(function(_, i){ return i; }).filter(function(i){ return !state.culturaEliminated[i]; });
      if (aliveIndexes.length <= 1){
        var winner = aliveIndexes.length === 1 ? state.players[aliveIndexes[0]] : null;
        app.innerHTML = topbar + '<div class="rail">' + rail + '</div>' +
          '<div class="stage-wrap"><div class="face face-back cat-cultura" style="position:static; transform:none; aspect-ratio:3/2.2;"><div class="cat-emoji">🏆</div><div class="challenge-text">¡GANADOR!</div><div class="challenge-sub">' + (winner ? esc(winner.name) : 'Nadie') + '</div></div>' +
          '<div class="play-actions"><button class="btn-primary" data-action="back-setup">Volver</button></div></div>';
        return;
      }
      var mediaHtml = state.card ? (state.card.image ? '<div class="who-photo"><img src="' + esc(state.card.image) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';"><div class="who-photo-fallback">👤</div></div>' : '<div class="cat-emoji">' + state.card.icon + '</div>') : '';
      
      var backFace = '<div class="face face-back ' + meta.cls + '">' + turnGlowHtml + '<span class="cat-badge">' + esc(meta.label) + '</span>' +
        mediaHtml +
        '<div class="challenge-text">' + esc(state.card ? state.card.text : '') + '</div>' +
        (state.card && state.card.answer && state.answerShown ? '<div class="answer-block"><div class="challenge-sub">' + esc(state.card.answer) + '</div></div>' : '') +
        '</div>';
      var actionsHtml = !state.answerShown 
        ? '<button class="btn-ghost" data-action="show-answer">Mostrar respuesta</button>'
        : '<div class="cultura-verdict"><button class="btn-primary" data-action="cultura-correct">✓ Acertó</button><button class="btn-primary" data-action="cultura-wrong">✗ Falló</button></div>';

      app.innerHTML = topbar + '<div class="rail">' + rail + '</div>' +
        '<div class="stage-wrap"><button class="tap-target" data-action="reveal"><div class="flip-card ' + (state.flipped ? 'flipped' : '') + '"><div class="face face-front">' + turnGlowHtml + '<div class="mark">?</div></div>' + backFace + '</div></button>' +
        '<div class="play-actions ' + (state.flipped ? '' : 'hidden') + '">' + actionsHtml + '</div></div>';
    }

    function triviaTopicName(key){
      if (key === 'historia_geografia') return 'Historia y Geografía';
      return key.replace('_', ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
    }

    function chooseTriviaQuestion(topicKey){
      var topic = DECK.trivia[topicKey];
      if (!topic.questions.length){
        return { topic: topicKey, subtema: 'Pendiente', empty: true, question: { text: 'Este tema todavía no tiene preguntas.', answer: null } };
      }
      var historyKey = 'trivia-questions-' + topicKey;
      var used = state.history[historyKey] || (state.history[historyKey] = []);
      var question = pickWithHistory(historyKey, topic.questions.map(function(item){ return { item: toEntry(item), w: 1 }; }));
      return { topic: topicKey, question: question };
    }

    function refillTriviaTopicQueues(){
      state.triviaTopicQueues = state.players.map(function(){ return shuffle(state.selectedTopics); });
    }

    function nextTriviaQuestion(){
      if (!state.triviaTopicQueues.length) refillTriviaTopicQueues();
      var queue = state.triviaTopicQueues[state.turn];
      if (!queue.length){
        if (state.triviaTopicQueues.every(function(playerQueue){ return playerQueue.length === 0; })) refillTriviaTopicQueues();
        queue = state.triviaTopicQueues[state.turn];
      }
      return chooseTriviaQuestion(queue.shift());
    }

    function renderTriviaBadges(playerIndex){
      var badges = state.triviaBadges[playerIndex] || [];
      return badges.map(function(key){ return '<span class="trivia-badge" style="background:' + DECK.trivia[key].color + ';">' + DECK.trivia[key].icon + '</span>'; }).join('');
    }

    function renderTriviaLives(playerIndex){
      if (isCompetitiveTrivia()) return '';
      return '<span class="player-life">❤ ' + state.triviaLives[playerIndex] + '</span>';
    }

    function triviaVictory(){
      return state.triviaWinner !== null;
    }

    function renderTriviaPlay(topbar, rail){
      var playerRail = '<div class="rail">' + rail + '</div>';
      var alive = state.players.map(function(_, i){ return i; }).filter(function(i){ return state.triviaLives[i] > 0; });
      if ((!isCompetitiveTrivia() && alive.length <= 1) || triviaVictory()){
        var winner = state.players[state.triviaWinner];
        if (!isCompetitiveTrivia()) winner = state.players[alive[0]];
        return topbar + playerRail + '<div class="stage-wrap"><div class="face face-back cat-cultura" style="position:static; transform:none; aspect-ratio:auto; min-height:360px; padding:26px;"><div class="cat-emoji">👑</div><div class="challenge-text">¡' + esc(winner.name) + ' gana!</div><div class="challenge-sub">' + (isCompetitiveTrivia() ? 'Consiguió todas las chapas de Trivia.' : 'Fue el último jugador con vida.') + '</div><div class="trivia-badges">' + (isCompetitiveTrivia() ? renderTriviaBadges(state.triviaWinner) : '') + '</div></div><div class="play-actions"><button class="btn-primary" data-action="back-setup">Volver a modos</button></div></div>';
      }
      if (!state.triviaRound) state.triviaRound = nextTriviaQuestion();
      var round = state.triviaRound;
      var topic = round.topic ? DECK.trivia[round.topic] : null;
      var answer = round.question.answer && state.answerShown
        ? '<div class="answer-block"><div class="challenge-sub">' + esc(round.question.answer) + '</div></div>'
        : '';
      var actions = state.answerShown
        ? '<div class="trivia-verdict"><button class="btn-error" data-action="trivia-wrong">✗ Falló</button><button class="btn-acerto" data-action="trivia-correct">✓ Acertó</button></div>'
        : round.empty
          ? '<div class="play-actions"><button class="btn-ghost" data-action="trivia-skip">Siguiente tema</button></div>'
          : '<div class="play-actions"><button class="btn-ghost" data-action="show-answer">Mostrar respuesta</button></div>';
      var card = '<button class="tap-target" data-action="trivia-reveal"><div class="flip-card ' + (state.flipped ? 'flipped' : '') + '">' +
        '<div class="face face-front">' +
          '<div class="turn-glow">Turno de <span class="turn-glow-name">' + esc(state.players[state.turn].name) + '</span></div>' +
          '<div class="mark">?</div><div class="tap-hint">Toca para revelar</div>' +
        '</div>' +
        '<div class="face face-back trivia-card-back" style="background:linear-gradient(160deg,' + topic.color + ',var(--surface));">' +
          '<span class="cat-badge">' + topic.icon + ' ' + esc(triviaTopicName(round.topic)) + '</span>' +
          '<div class="challenge-text">' + esc(round.question.text) + '</div>' + answer +
        '</div>' +
      '</div></button>';
      return topbar + playerRail + '<div class="stage-wrap">' + (!isCompetitiveTrivia() ? '<div class="round-badge" style="display:inline-block; margin-bottom:10px;">❤ ' + state.triviaLives[state.turn] + ' vidas · Daño: ' + state.drinkConfig.culturaDamage + '</div>' : '') + card + (state.flipped ? actions : '') + '</div>';
    }

    function advanceTriviaTurn(correct){
      var round = state.triviaRound;
      if (correct){
        if (isCompetitiveTrivia()){
          var scores = state.triviaScores[state.turn];
          scores[round.topic] += 1;
          if (scores[round.topic] >= 3 && state.triviaBadges[state.turn].indexOf(round.topic) === -1) state.triviaBadges[state.turn].push(round.topic);
          if (state.triviaBadges[state.turn].length === state.selectedTopics.length){
            state.triviaWinner = state.turn;
            state.triviaRound = null;
            render();
            return;
          }
        }
      } else if (!isCompetitiveTrivia()) {
        state.triviaLives[state.turn] = Math.max(0, state.triviaLives[state.turn] - Number(state.drinkConfig.culturaDamage || 0));
        if (state.triviaLives[state.turn] === 0) state.culturaEliminated[state.turn] = true;
      }
      state.triviaRound = null;
      state.answerShown = false;
      var attempts = 0;
      do {
        state.turn = (state.turn + 1) % state.players.length;
        attempts++;
      } while (!isCompetitiveTrivia() && state.triviaLives[state.turn] <= 0 && attempts < state.players.length);
      state.round += 1;
      if (!isCompetitiveTrivia() && state.triviaLives.filter(function(life){ return life > 0; }).length <= 1){
        state.triviaRound = null;
      }
      render();
    }

    function renderPlay(){
      var current = state.players[state.turn];
      var turnGlowHtml = '<div class="turn-glow"><span class="turn-glow-name">' + esc(current.name) + '</span></div>';
      var rail = state.players.map(function(p, i){
        return '<div class="rail-player ' + (i === state.turn ? 'current' : '') + '"><span class="avatar" style="background:' + p.color + '">' + esc(initials(p.name)) + '</span><small>' + esc(p.name) + '</small>' + renderTriviaLives(i) + '<div class="trivia-badges">' + renderTriviaBadges(i) + '</div></div>';
      }).join('');

      var topbar = '<div class="topbar"><button class="icon-btn" data-action="back-setup">‹</button><span class="round-badge">Ronda ' + state.round + '</span></div>';

      if (state.espia){ app.innerHTML = topbar + renderEspiaStage(); return; }
      if (state.selectedMode === 'pasapalabra'){ app.innerHTML = topbar + '<div class="rail">' + rail + '</div>' + renderPasapalabraStage(); return; }
      if (state.selectedMode === 'cultura' && !state.modoHistoria && !state.modoPapu){ app.innerHTML = renderTriviaPlay(topbar, rail); return; }

      var backFace = '';
      var actionsHtml = '';
      if (state.card){
        var meta = DECK[state.card.cat] || {
          historia: { label: 'Historia', cls: 'cat-cultura' },
          papu: { label: 'Modo Papu', cls: 'cat-papu' }
        }[state.card.cat] || { label: 'Carta', cls: 'cat-juegos' };
        backFace = '<div class="face face-back ' + meta.cls + '">' + turnGlowHtml + '<span class="cat-badge">' + esc(meta.label) + '</span><div class="challenge-text">' + esc(state.card.text) + '</div>' + (state.card.sub ? '<div class="challenge-sub">' + esc(state.card.sub) + '</div>' : '') + '</div>';
        actionsHtml = '<button class="btn-primary" data-action="next-turn">Siguiente turno</button>';
      } else {
        backFace = '<div class="face face-back cat-nunca"></div>';
      }

      app.innerHTML = topbar + '<div class="rail">' + rail + '</div>' +
        '<div class="stage-wrap"><button class="tap-target" data-action="reveal"><div class="flip-card ' + (state.flipped ? 'flipped' : '') + '"><div class="face face-front">' + turnGlowHtml + '<div class="mark">?</div><div class="tap-hint">Toca para revelar</div></div>' + backFace + '</div></button>' +
        '<div class="play-actions ' + (state.flipped ? '' : 'hidden') + '">' + actionsHtml + '</div></div>';
    }

    function render(){
      if (state.screen === 'welcome') renderWelcome();
      else if (state.screen === 'mode-select') renderModeSelect();
      else if (state.screen === 'player-setup') renderPlayerSetup();
      else if (state.screen === 'ajustes') renderAjustes();
      else renderPlay();
    }

    app.addEventListener('click', function(e){
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var action = t.getAttribute('data-action');

      if (action === 'go-mode-select'){ state.screen = 'mode-select'; render(); }
      else if (action === 'back-welcome'){ state.screen = 'welcome'; render(); }
      else if (action === 'back-mode-select'){ state.screen = 'mode-select'; render(); }
      else if (action === 'open-ajustes'){ state.screen = 'ajustes'; render(); }
      else if (action === 'close-ajustes'){ state.screen = 'player-setup'; render(); }
      else if (action === 'apply-truco'){
        var input = document.getElementById('truco-input');
        var key = input ? input.value.trim().toLowerCase().replace(/\s+/g, '') : '';
        state.modoHistoria = false;
        state.modoPapu = false;
        state.modoAmigos = false;
        if (key === 'historia' || key === 'modohistoria') {
          state.modoHistoria = true;
          state.trucoMensaje = 'Modo Historia activado.';
        } else if (key === 'papu' || key === 'modopapu') {
          state.modoPapu = true;
          state.trucoMensaje = 'Modo Papu activado.';
        } else if (key === 'amigos' || key === 'modoamigos') {
          state.modoAmigos = true;
          state.trucoMensaje = 'Cartas privadas activadas.';
        } else {
          state.trucoMensaje = 'Clave no reconocida.';
        }
        state.lastCategory = null;
        render();
      }
      else if (action === 'select-mode'){
        state.selectedMode = t.getAttribute('data-mode');
        state.players = [];
        state.selectedTopics = state.selectedMode === 'cultura' ? [] : state.selectedTopics;
        state.screen = 'player-setup';
        render();
      } else if (action === 'remove-player'){
        state.players.splice(Number(t.getAttribute('data-idx')), 1);
        render();
      } else if (action === 'set-cards'){
        state.cards = t.getAttribute('data-value');
        render();
      } else if (action === 'start'){
        if (!canStart()) return;
        state.screen = 'play';
        state.turn = 0;
        state.round = 1;
        state.flipped = false;
        state.card = null;
        if (state.selectedMode === 'cultura'){
          state.triviaScores = state.players.map(function(){
            var scores = {};
            state.selectedTopics.forEach(function(topic){ scores[topic] = 0; });
            return scores;
          });
          state.triviaBadges = state.players.map(function(){ return []; });
          state.triviaLives = state.players.map(function(){ return 100; });
          state.culturaEliminated = state.players.map(function(){ return false; });
          state.history = {};
          refillTriviaTopicQueues();
          state.triviaRound = null;
          state.triviaWinner = null;
        }
        if (state.selectedMode === 'pasapalabra'){
          var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
          state.roscos = state.players.map(function() {
            var questions = letters.map(function(l) {
              var pool = PASAPALABRA_WORDS[l] || [{text: "Empieza con " + l, answer: "..."}];
              var q = pool[Math.floor(Math.random() * pool.length)];
              return { letter: l, text: q.text, answer: q.answer, status: 'pending' };
            });
            return { questions: questions, currentIndex: 0, active: false, finished: false };
          });
          var pasapalabraTime = Number(state.drinkConfig.pasapalabraTime) || 120;
          state.playerTimers = state.players.map(function(){ return pasapalabraTime; });
        }
        render();
      } else if (action === 'back-setup'){ state.screen = 'mode-select'; render(); }
      else if (action === 'trivia-skip'){
        advanceTriviaTurn(false);
      } else if (action === 'trivia-correct'){
        advanceTriviaTurn(true);
      } else if (action === 'trivia-wrong'){
        advanceTriviaTurn(false);
      } else if (action === 'trivia-reveal'){
        if (state.flipped) return;
        state.flipped = true;
        state.answerShown = false;
        render();
      }
      else if (action === 'reveal'){
        if (state.flipped) return;
        drawChallenge();
        state.flipped = true;
        state.answerShown = false;
        render();
      } else if (action === 'show-answer'){ state.answerShown = true; render(); }
      else if (action === 'next-turn'){
        state.turn = (state.turn + 1) % state.players.length;
        state.round += 1;
        state.flipped = false;
        state.card = null;
        render();
      } else if (action === 'pasa-start') { startRoscoTimer(); render(); }
      else if (action === 'pasa-acerto') {
        var r = state.roscos[state.turn];
        r.questions[r.currentIndex].status = 'correct';
        if (!checkRoscoEnd()) { advanceRoscoIndex(); render(); }
        else { nextRoscoPlayer(); }
      } else if (action === 'pasa-error' || action === 'pasa-pasapalabra') {
        var r = state.roscos[state.turn];
        r.questions[r.currentIndex].status = action === 'pasa-error' ? 'error' : 'pending';
        if (action === 'pasa-error') checkRoscoEnd();
        nextRoscoPlayer();
      } else if (action === 'start-espia'){ startEspia(); render(); }
      else if (action === 'reveal-espia'){ state.espia.revealed = true; render(); }
      else if (action === 'next-espia-step'){ state.espia.step += 1; state.espia.revealed = false; render(); }
      else if (action === 'finish-espia'){ state.espia = null; state.turn = (state.turn + 1) % state.players.length; render(); }
    });

    app.addEventListener('change', function(e){
      var target = e.target;
      var action = target.getAttribute('data-action');
      if (action === 'set-drink-config'){
        var field = target.getAttribute('data-field');
        var value = Number(target.value);
        if (Number.isFinite(value)) state.drinkConfig[field] = value;
      } else if (action === 'toggle-cultura') {
        state.culturaEnabled = target.checked;
      } else if (action === 'toggle-trivia-topic') {
        var topic = target.getAttribute('data-topic');
        if (target.checked && state.selectedTopics.length < 6) state.selectedTopics.push(topic);
        else if (!target.checked) state.selectedTopics = state.selectedTopics.filter(function(key){ return key !== topic; });
        else target.checked = false;
        render();
      }
    });

    render();
  })();
</script>
