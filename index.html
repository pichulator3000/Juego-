<title>Copetapp</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#150C2B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    color-scheme: dark;
    --ink:#150C2B;
    --ink-2:#1E1240;
    --surface:#211539;
    --surface-2:#2C1B4C;
    --line: rgba(248,244,255,.12);
    --line-strong: rgba(248,244,255,.22);
    --pink:#FF3D8F;
    --pink-deep:#93104F;
    --lime:#D8FF3E;
    --lime-deep:#8FB000;
    --cyan:#2FE6C4;
    --cyan-deep:#0E9A7F;
    --violet:#8B5CF6;
    --violet-deep:#4E2FA9;
    --cloud:#F8F4FF;
    --muted:#B6A6DA;

    /* categoría → par de colores del degradé del reverso de carta */
    --cat-nunca-1: var(--violet);      --cat-nunca-2: #5B3FD6;
    --cat-retos-1: var(--pink);        --cat-retos-2: #D61E73;
    --cat-juegos-1: var(--cyan);       --cat-juegos-2: #12B596;
    --cat-cultura-1: var(--lime);      --cat-cultura-2: #A8D61E;
    --cat-trago-1: var(--pink);        --cat-trago-2: var(--violet);
    --cat-regala-1: var(--cyan);       --cat-regala-2: var(--lime);
    --cat-evento-1: var(--pink);       --cat-evento-2: var(--lime); --cat-evento-3: var(--cyan);
    --cat-impostor-word-1: var(--lime); --cat-impostor-word-2: #A8D61E;
    --cat-impostor-spy-1: var(--pink);  --cat-impostor-spy-2: #93104F;

    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
    --font-body: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* Century Gothic no viene instalada en iOS — Futura sí es una fuente de
       sistema en iPhone y es el geometric sans más parecido, así que actúa
       de respaldo real (no solo un fallback cualquiera) en ese dispositivo. */
    --font-gothic: "Century Gothic", Futura, var(--font-display);

    --text-xs: 11px; --text-sm: 13px; --text-base: 15px; --text-lg: clamp(17px, 4.6vw, 19px);
    --text-xl: clamp(26px, 8vw, 32px); --text-display: clamp(30px, 9.5vw, 38px);

    --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-xl: 26px;
    --shadow-sm: 0 2px 8px -2px rgba(9,4,24,.35);
    --shadow-md: 0 10px 24px -10px rgba(9,4,24,.5);
    --shadow-card: 0 24px 48px -20px rgba(9,4,24,.65), 0 2px 10px -2px rgba(9,4,24,.4);
    --ease-spring: cubic-bezier(.22,1.12,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background: radial-gradient(120% 60% at 50% -10%, var(--surface-2), var(--ink) 55%);
    color:var(--cloud);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    position:relative;
  }

  /* textura fina de grano — le quita el look "gradiente plano" al fondo */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ambient blobs — part of the product's own atmosphere, not device chrome */
  .blob{ position:fixed; border-radius:50%; filter: blur(78px); opacity:.28; pointer-events:none; z-index:0; will-change:transform; }
  .blob-a{ width:60vw; height:60vw; max-width:420px; max-height:420px; background:var(--pink); top:-14%; left:-18%; }
  .blob-b{ width:55vw; height:55vw; max-width:380px; max-height:380px; background:var(--cyan); bottom:-16%; right:-16%; }
  .blob-c{ width:40vw; height:40vw; max-width:300px; max-height:300px; background:var(--violet); bottom:22%; left:-8%; opacity:.2; }
  @media (prefers-reduced-motion: no-preference){
    .blob-a{ animation: float-a 22s ease-in-out infinite; }
    .blob-b{ animation: float-b 26s ease-in-out infinite; }
    .blob-c{ animation: float-c 19s ease-in-out infinite; }
  }
  @keyframes float-a{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(6vw,5vh) scale(1.08);} }
  @keyframes float-b{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-5vw,-6vh) scale(1.06);} }
  @keyframes float-c{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(4vw,-4vh);} }

  /* ============ entrada de pantalla (setup ⇄ play) ============ */
  /* Nota: esto se usa puntualmente (answer-block, play-actions), nunca en
     todo #app de una — como #app se reemplaza entero en cada render(),
     poner esta animación en ".app > *" hacía que TODO el menú parpadeara
     y se viera como si se reseteara cada vez que tocabas cualquier botón. */
  @keyframes screen-in{ 0%{ opacity:0; transform:translateY(10px); } 100%{ opacity:1; transform:translateY(0); } }

  /* ============ app shell — real page, sized for iPhone safe areas ============ */
  .app-shell{
    position:relative; z-index:1;
    width:100%; max-width:480px; margin:0 auto;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding-top: max(28px, env(safe-area-inset-top));
    padding-bottom: max(22px, env(safe-area-inset-bottom));
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }

  .app{ flex:1; }

  /* ============ shared type ============ */
  .setup-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ font-family: var(--font-display); font-weight:900; letter-spacing:-.025em; font-size:var(--text-display); line-height:1;
    background: linear-gradient(100deg, var(--pink), var(--lime) 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 18px rgba(255,61,143,.22)); }
  .section-label{ font-family:var(--font-display); font-weight:700; font-size:var(--text-xs); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin: 24px 0 10px; display:flex; align-items:center; gap:6px; }
  .section-label .count{ font-family:var(--font-mono); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--cloud); font-weight:500; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums; }

  button{ font: inherit; -webkit-tap-highlight-color:transparent; cursor:pointer; }
  button:active{ transform:scale(.96); }
  button, .switch .thumb, .chip{ transition: transform .15s var(--ease-spring), background-color .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease; }

  /* ============ player chips ============ */
  .player-form{ display:flex; gap:8px; margin-top:8px; }
  .player-form input{
    flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:12px 14px; color:var(--cloud); font-size:16px; font-family:var(--font-body);
    transition: border-color .18s ease, background-color .18s ease;
  }
  .player-form input::placeholder{ color:var(--muted); }
  .player-form input:focus-visible{ outline:2px solid var(--pink); outline-offset:1px; border-color:var(--pink); }
  .add-btn{
    width:46px; height:46px; border-radius:var(--r-sm); border:none; flex-shrink:0;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-sm);
  }
  .add-btn:active{ transform:scale(.92) rotate(-4deg); }
  .add-btn:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }

  .players-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{
    display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line);
    border-radius:24px; padding:6px 10px 6px 6px; font-size:14px;
    animation: chip-in .3s var(--ease-spring) both;
  }
  @media (prefers-reduced-motion: no-preference){
    @keyframes chip-in{ 0%{ opacity:0; transform:scale(.7); } 100%{ opacity:1; transform:scale(1); } }
  }
  .chip:hover{ border-color:var(--line-strong); }
  .chip .avatar{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:var(--ink); flex-shrink:0; }
  .chip button{ background:none; border:none; color:var(--muted); font-size:15px; line-height:1; padding:2px; }
  .chip button:focus-visible{ outline:2px solid var(--pink); border-radius:50%; }
  .empty-hint{ font-size:13px; color:var(--muted); margin-top:10px; }

  /* ============ mode cards ============ */
  .mode-card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); padding:14px; margin-bottom:10px; box-shadow: var(--shadow-sm);
  }
  .mode-icon{ width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .mode-icon.futbol{ background: radial-gradient(circle at 30% 30%, var(--cyan), var(--cyan-deep)); }
  .mode-icon.disco{ background: conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--lime), var(--pink)); }
  .mode-copy{ flex:1; min-width:0; }
  .mode-copy strong{ display:block; font-size:15px; }
  .mode-copy span{ display:block; font-size:12.5px; color:var(--muted); margin-top:1px; }

  /* ============ configurador de tragos (ajustes) ============ */
  .drink-config{ display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:6px 14px; box-shadow:var(--shadow-sm); }
  .drink-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .drink-row:last-child{ border-bottom:none; }
  .drink-row span{ font-size:13.5px; color:var(--cloud); }
  .drink-input{
    width:56px; flex-shrink:0; text-align:center; background:var(--surface-2); border:1px solid var(--line);
    border-radius:10px; padding:8px 4px; color:var(--cloud); font-family:var(--font-mono); font-size:15px;
    font-variant-numeric:tabular-nums; transition:border-color .18s ease;
  }
  .drink-input:focus-visible{ outline:2px solid var(--pink); outline-offset:1px; border-color:var(--pink); }
  .drink-input::-webkit-inner-spin-button{ opacity:1; }

  .switch{ position:relative; width:48px; height:28px; flex-shrink:0; }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
  .switch .track{ position:absolute; inset:0; border-radius:16px; background:var(--surface-2); border:1px solid var(--line); transition:background .25s ease; }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--cloud); transition:transform .28s var(--ease-spring); box-shadow:0 2px 4px rgba(0,0,0,.3); }
  .switch input:checked + .track{ background:var(--cyan); }
  .switch input:checked + .track + .thumb{ transform:translateX(20px); }
  .switch.disco input:checked + .track{ background: conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--lime), var(--pink)); }
  @media (prefers-reduced-motion: no-preference){
    .switch.disco input:checked + .track{ animation: spin-hue 3s linear infinite; }
  }
  @keyframes spin-hue{ to{ filter: hue-rotate(360deg); } }
  .switch input:focus-visible + .track{ outline:2px solid var(--lime); outline-offset:2px; }

  /* ============ segmented control ============ */
  .segmented{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:4px; gap:4px; }
  .segmented button{
    flex:1; border:none; background:transparent; color:var(--muted); font-family:var(--font-body); font-weight:600;
    font-size:14px; padding:10px 0; border-radius:10px; transition:background .18s ease, color .18s ease, transform .15s var(--ease-spring);
  }
  .segmented button.active{ background: linear-gradient(135deg, var(--pink), var(--violet)); color:#fff; box-shadow: var(--shadow-sm); }
  .segmented button:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; }
  .card-copy{ font-size:12.5px; color:var(--muted); margin-top:8px; }

  /* ============ start button ============ */
  .start-btn{
    width:100%; margin-top:26px; border:none; border-radius:var(--r-md); padding:17px;
    font-family:var(--font-display); font-weight:800; font-size:17px; color:var(--ink);
    background: linear-gradient(100deg, var(--lime), var(--cyan));
    box-shadow: 0 14px 28px -10px rgba(216,255,62,.45);
    transition: transform .15s var(--ease-spring), box-shadow .2s ease, opacity .2s ease;
  }
  .start-btn:disabled{ opacity:.35; box-shadow:none; }
  .start-btn:not(:disabled):active{ transform:scale(.97); box-shadow: 0 6px 16px -8px rgba(216,255,62,.4); }
  .start-btn:focus-visible{ outline:2px solid var(--cloud); outline-offset:2px; }
  .start-hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }

  /* ============ welcome / mode select ============ */
  .welcome-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; padding:20px; }
  .welcome-screen .brand{ filter: drop-shadow(0 6px 18px rgba(255,61,143,.22)); margin-bottom:8px; }
  .welcome-btn{ width:100%; max-width:320px; }

  .mode-blocks{ display:flex; flex-direction:column; gap:12px; width:100%; max-width:440px; margin-top:8px; }
  .mode-block{ display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; text-align:left; box-shadow:var(--shadow-sm); transition:transform .15s var(--ease-spring), border-color .18s ease, box-shadow .18s ease; }
  .mode-block:active{ transform:scale(.98); }
  .mode-block:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }
  .mode-block-icon{ width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
  .mode-block[data-mode="pre"] .mode-block-icon{ background:radial-gradient(circle at 30% 30%, var(--cyan), var(--cyan-deep)); }
  .mode-block[data-mode="disco"] .mode-block-icon{ background:conic-gradient(from 0deg, var(--pink), var(--violet), var(--cyan), var(--lime), var(--pink)); }
  .mode-block[data-mode="cultura"] .mode-block-icon{ background:radial-gradient(circle at 30% 30%, var(--lime), var(--lime-deep)); }
  .mode-block-info{ flex:1; min-width:0; }
  .mode-block-info strong{ display:block; font-size:16px; margin-bottom:2px; }
  .mode-block-info span{ font-size:13px; color:var(--muted); line-height:1.3; }

  /* ============ play screen ============ */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
  .icon-btn{ width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--line); color:var(--cloud); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:active{ transform:scale(.9); background:var(--surface-2); }
  .icon-btn:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }
  .round-badge{ font-family:var(--font-mono); font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .mode-flags{ display:flex; gap:6px; }
  .mode-flags span{ width:30px; height:30px; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:13px; opacity:.3; transition:opacity .2s ease, transform .2s var(--ease-spring); }
  .mode-flags span.on{ opacity:1; transform:scale(1.05); }

  .rail{ display:flex; gap:10px; overflow-x:auto; padding:16px 2px 6px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .rail::-webkit-scrollbar{ display:none; }
  .rail-player{ display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; opacity:.5; transition:opacity .25s ease, transform .25s var(--ease-spring); scroll-snap-align:center; }
  .rail-player.current{ opacity:1; transform:scale(1.1); }
  .rail-player .avatar{ width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--ink); transition:box-shadow .25s ease; }
  .rail-player.current .avatar{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--pink), 0 0 14px -2px var(--pink); }
  .rail-player small{ font-size:10px; color:var(--muted); max-width:44px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .stage-wrap{ margin-top:18px; perspective:1200px; }
  @media (prefers-reduced-motion: no-preference){
    .stage-wrap{ animation: stage-in .4s var(--ease-spring) both; }
  }
  @keyframes stage-in{ 0%{ opacity:0; transform:translateY(14px); } 100%{ opacity:1; transform:translateY(0); } }
  .turn-glow{
    font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.02em;
    color:#fff; background:rgba(0,0,0,.28); padding:4px 14px; border-radius:20px;
    margin-bottom:10px; box-shadow:0 0 10px rgba(255,255,255,.45);
  }
  .turn-glow-name{ font-family:var(--font-mono); font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
  @media (prefers-reduced-motion: no-preference){
    .turn-glow{ animation: turn-glow-pulse 2.6s ease-in-out infinite; }
  }
  @keyframes turn-glow-pulse{
    0%, 100%{ box-shadow:0 0 8px rgba(255,255,255,.35); }
    50%{ box-shadow:0 0 16px rgba(255,255,255,.85); }
  }

  /* OJO: .flip-card no debe llevar ninguna animation/keyframe que toque
     "transform" — es la misma propiedad que usa .flipped para rotar la
     carta, y una animation siempre gana por encima de esa regla de clase,
     dejando la carta trabada mostrando solo la cara frontal para siempre. */
  .flip-card{ position:relative; width:100%; aspect-ratio:3/3.9; margin-top:16px; transform-style:preserve-3d; transition:transform .65s cubic-bezier(.2,.9,.25,1); filter:drop-shadow(var(--shadow-card)); }
  .flip-card.flipped{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion: reduce){ .flip-card{ transition:none; } }
  .tap-target:active .flip-card:not(.flipped){ transform:scale(.98); }
  .face{ position:absolute; inset:0; border-radius:var(--r-xl); backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; overflow-y:auto; scrollbar-width:none; }
  .face::-webkit-scrollbar{ display:none; }
  .face-front{
    background: radial-gradient(120% 100% at 50% 0%, var(--surface-2), var(--surface));
    border:1px solid var(--line);
  }
  .face-front .mark{ font-family:var(--font-display); font-size:46px; font-weight:900; color:var(--muted); opacity:.45; }
  @media (prefers-reduced-motion: no-preference){
    .face-front .mark{ animation: mark-breathe 2.8s ease-in-out infinite; }
  }
  @keyframes mark-breathe{ 0%,100%{ opacity:.4; transform:scale(1); } 50%{ opacity:.65; transform:scale(1.06); } }
  .face-front .tap-hint{ margin-top:10px; font-size:13px; color:var(--muted); font-weight:600; }
  .face-back{ transform:rotateY(180deg); color:var(--ink); }
  .face-back.cat-nunca{ background: linear-gradient(160deg, var(--cat-nunca-1), var(--cat-nunca-2)); color:#fff; }
  .face-back.cat-retos{ background: linear-gradient(160deg, var(--cat-retos-1), var(--cat-retos-2)); color:#fff; }
  .face-back.cat-juegos{ background: linear-gradient(160deg, var(--cat-juegos-1), var(--cat-juegos-2)); }
  .face-back.cat-cultura{ background: linear-gradient(160deg, var(--cat-cultura-1), var(--cat-cultura-2)); }
  .face-back.cat-trago{ background: linear-gradient(155deg, var(--cat-trago-1), var(--cat-trago-2)); color:#fff; }
  .face-back.cat-regala{ background: linear-gradient(155deg, var(--cat-regala-1), var(--cat-regala-2)); }
  .face-back.cat-evento{ background: linear-gradient(120deg, var(--cat-evento-1), var(--cat-evento-2) 55%, var(--cat-evento-3)); }
  .face-back.cat-espia-word{ background: linear-gradient(160deg, var(--cat-impostor-word-1), var(--cat-impostor-word-2)); }
  .face-back.cat-espia-spy{ background: linear-gradient(160deg, var(--cat-impostor-spy-1), var(--cat-impostor-spy-2)); color:#fff; }
  .face-back.cat-papu{ background: linear-gradient(160deg, var(--pink), var(--pink-deep)); color:#fff; }
  

  /* ============ cartas especiales de evento ============ */
  .face-back.special-opus{
    background: linear-gradient(135deg, #1A0B3D, #4A1A6B 40%, var(--pink) 75%, var(--cyan));
    background-size: 240% 240%; color:#fff;
  }
  @media (prefers-reduced-motion: no-preference){
    .face-back.special-opus{ animation: opus-shimmer 4s ease-in-out infinite; }
  }
  @keyframes opus-shimmer{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }

        { text: '¿Qué componente mecánico mezcla el aire y el combustible en los motores de combustión antiguos?', answer: 'Carburador' },

        { text: '¿Cómo se llama el lado derecho de un barco cuando el observador mira hacia adelante?', answer: 'Estribor' },

        { text: 'Si el ayer de mañana es el día de hoy, y el mañana de ayer también es hoy, ¿qué día es el día que está justo en medio del ayer del anteayer y el mañana del pasado mañana?', answer: 'Hoy' },
        { text: 'Si cinco máquinas tardan cinco minutos en fabricar cinco artefactos, ¿cuánto tiempo tardarían cien máquinas en fabricar cien artefactos?', answer: 'Cinco minutos' },
        { text: 'Un caracol sube una pared de diez metros de altura. Durante el día sube tres metros, pero por la noche resbala dos metros. ¿Cuántos días exactos tarda en llegar a la cima?', answer: 'Ocho días (al octavo día sube tres y llega a la cima antes de resbalar)' },
        { text: 'En una carrera de relevos de cuatro personas, el segundo corredor le entrega la posta al tercero, el tercero al cuarto, y el cuarto cruza la meta. ¿Quién recorrió exactamente la mayor distancia acumulada en la pista?', answer: 'El segundo corredor (porque corrió su tramo y además tuvo que cargar la posta estática esperando o avanzando)' },
        { text: 'Si tienes un reloj de arena que mide exactamente 7 minutos y otro que mide 4 minutos, ¿cómo puedes hacer para medir con precisión exacta un tiempo transcurrido de 9 minutos?', answer: 'Pones ambos en marcha a la vez; cuando se acabe el de 4, lo vuelves a girar inmediatamente. Al acabarse de nuevo, habrán pasado 8 minutos, y te queda 1 minuto exacto en el de 7 para completar los 9.' },
        { text: 'Si un oso camina cinco kilómetros hacia el sur, cinco kilómetros hacia el este y cinco kilómetros hacia el norte, terminando exactamente en el mismo punto de partida, ¿de qué color es el oso?', answer: 'Blanco (está en el Polo Norte)' },
        { text: 'Una madre tiene 46 años y su hijo tiene 16 años. ¿Dentro de cuántos años exactos la edad de la madre será exactamente el doble de la edad de su hijo?', answer: '14 años (la madre tendrá 60 y el hijo 30)' },
        { text: 'Tienes tres cajas cerradas frente a ti: una tiene solo manzanas, otra solo naranjas, y la tercera tiene una mezcla de ambas. Todas tienen etiquetas erróneas. Sacando una sola fruta de una sola caja a ciegas, ¿cómo puedes averiguar el contenido real de todas?', answer: 'Sacando de la caja etiquetada como "Mixta" (como está mal rotulada, lo que salga es lo que tiene esa caja, y por lógica deduces las otras dos)' },
        { text: 'Si vas en tu auto en una noche de tormenta total y pasas por una parada de autobús donde ves a tres personas esperando: una anciana enferma que necesita ir de urgencia al médico, un viejo amigo que te salvó la vida en el pasado, y la mujer u hombre de tus sueños. Tu auto solo tiene espacio para ti y un pasajero más. ¿A quién subes?', answer: 'Le das las llaves de tu auto a tu amigo para que lleve a la anciana al hospital, y tú te quedas esperando el autobús con la persona de tus sueños.' },
        { text: 'Un hombre deja su auto estacionado frente a un hotel y al regresar se da cuenta de que está completamente en bancarrota y ha perdido todo su dinero. ¿Por qué ocurrió esto?', answer: 'Estaba jugando al Monopoly' },

        { text: '¿Qué nombre recibe la división celular asexual que da origen a dos células hijas genéticamente idénticas?', answer: 'Mitosis' },
        { text: '¿Cuál es el pH neutro en la escala química de acidez y alcalinidad?', answer: '7' },
        { text: '¿Qué tipo de radiación electromagnética tiene la longitud de onda más corta y la mayor energía en el espectro?', answer: 'Rayos gamma' },
        { text: '¿Cómo se denominan los fragmentos de roca espacial que logran atravesar la atmósfera terrestre y chocar con la superficie?', answer: 'Meteoritos' },
        { text: '¿Qué nombre recibe el punto de fusión en el que un sólido pasa al estado líquido?', answer: 'Punto de fusión' },
        { text: '¿Cuál es el órgano más grande del cuerpo humano en términos de superficie y peso total?', answer: 'La piel' },
        { text: '¿Qué ley física establece que la energía no se crea ni se destruye, solo se transforma?', answer: 'Principio de conservación de la energía (Primera ley de la termodinámica)' },
        { text: '¿Cómo se llaman las células sanguíneas encargadas de transportar el oxígeno desde los pulmones a los tejidos?', answer: 'Glóbulos rojos (o eritrocitos)' },
        { text: '¿Qué instrumento se utiliza para medir la presión atmosférica?', answer: 'Barómetro' },
        { text: '¿Cuál es el nombre de la galaxia espiral más cercana a nuestra Vía Láctea?', answer: 'Andrómeda' },
        { text: '¿Qué tipo de roca se forma a partir del enfriamiento y solidificación del magma o lava?', answer: 'Roca ígnea' },
        { text: '¿Cómo se llama la parte líquida de la sangre que transporta células, nutrientes y sustancias de desecho?', answer: 'Plasma sanguíneo' },
        { text: '¿Qué nombre recibe la capa sólida y superficial de la Tierra que incluye la corteza y el manto superior?', answer: 'Litósfera' },
        { text: '¿Cuál es el hueso ubicado en la parte anterior y central del tórax al que se conectan las costillas?', answer: 'Esternón' },
        { text: '¿Qué fenómeno óptico descompone la luz blanca en los colores del arcoíris al atravesar un medio como un prisma?', answer: 'Dispersión de la luz' },
        { text: '¿Cómo se denominan los organismos que obtienen su alimento consumiendo materia orgánica de otros seres vivos?', answer: 'Heterótrofos' },
        { text: '¿Qué nombre recibe el punto de una órbita en el que un planeta se encuentra más cerca del Sol?', answer: 'Perihelio' },
        { text: '¿Cuál es el metal líquido a temperatura ambiente más común utilizado tradicionalmente en termómetros?', answer: 'Mercurio' },
        { text: '¿Qué estructura del ojo humano actúa como lente ajustable para enfocar objetos a diferentes distancias?', answer: 'Cristalino' },
        { text: '¿Cómo se llama la unidad de medida de la frecuencia en el Sistema Internacional de Unidades?', answer: 'Hercio (o Hertz)' },
        { text: '¿Qué proceso geológico desplaza lentamente los continentes sobre la superficie terrestre debido a corrientes en el manto?', answer: 'Tectónica de placas' },
        { text: '¿Cuál es el nombre de la hormona producida por el páncreas encargada de reducir los niveles de glucosa en sangre?', answer: 'Insulina' },
        { text: '¿Qué nombre recibe el cambio de estado en el que un gas se convierte directamente en líquido?', answer: 'Condensación (o licuación)' },
        { text: '¿Cómo se llaman las líneas imaginarias en un mapa que unen puntos de igual presión atmosférica?', answer: 'Isobáricas (o isobaras)' },
        { text: '¿Qué tipo de lente es más gruesa en los bordes que en el centro y diverge los rayos de luz?', answer: 'Lente cóncava (o divergente)' },
        { text: '¿Cuál es el mineral más duro conocido en la escala de Mohs de dureza?', answer: 'Diamante' },
        { text: '¿Qué nombre recibe el conjunto de todas las reacciones químicas que ocurren dentro de un organismo vivo?', answer: 'Metabolismo' },
        { text: '¿Cómo se llaman los extremos de un imán donde la fuerza magnética es más intensa?', answer: 'Polos magnéticos (Norte y Sur)' },
        { text: '¿Qué capa interior de la Tierra se encuentra en estado líquido y está compuesta principalmente de hierro y níquel?', answer: 'Núcleo externo' },
        { text: '¿Cuál es la unidad básica de la herencia genética que se encuentra en los cromosomas?', answer: 'Gen' },
        { text: '¿Qué nombre recibe la velocidad constante que alcanza un objeto al caer a través de un fluido cuando la gravedad se iguala con la resistencia?', answer: 'Velocidad límite (o terminal)' },
        { text: '¿Cómo se denominan las estrellas que varían su brillo de forma periódica debido a cambios en su estructura interna?', answer: 'Estrellas variables' },
        { text: '¿Qué vitamina es fundamental para la coagulación sanguínea adecuada y la salud de los huesos?', answer: 'Vitamina K' },
        { text: '¿Cuál es el gas noble más ligero y el segundo elemento más abundante del universo después del hidrógeno?', answer: 'Helio' },
        { text: '¿Qué nombre recibe la membrana doble que envuelve y protege el núcleo celular?', answer: 'Envoltura nuclear (o carioteca)' },
        { text: '¿Cómo se llama el instrumento utilizado para medir magnitudes eléctricas como corriente, voltaje y resistencia?', answer: 'Multímetro (o tester)' },
        { text: '¿Qué científico propuso las leyes del movimiento y la ley de la gravitación universal?', answer: 'Isaac Newton' },
        { text: '¿Cuál es el nombre de la válvula cardíaca situada entre la aurícula izquierda y el ventrículo izquierdo?', answer: 'Válvula mitral (o bicúspide)' },
        { text: '¿Cuál es el único mamífero del mundo que tiene la capacidad de volar de forma natural y sostenida?', answer: 'El murciélago' },
        { text: 'A pesar de su gran tamaño y aspecto pesado, ¿qué animal puede correr en tierra a una velocidad de hasta 50 km/h?', answer: 'El hipopótamo' },
        { text: '¿De qué color inusual es la leche que segregan los hipopótamos para proteger su piel del sol?', answer: 'Rosa (o rojiza)' },
        { text: '¿Qué animal pasa la mayor parte de su vida colgado boca abajo de las ramas y se mueve tan lento que le crecen algas verdes en el pelaje?', answer: 'El perezoso' },
        { text: '¿Qué animal marino puede cambiar completamente de color y de textura en menos de un segundo para camuflarse?', answer: 'El pulpo' },
        { text: '¿Qué animal es conocido como el "ingeniero de la naturaleza" por construir grandes diques y presas de madera en los ríos?', answer: 'El castor' },
        { text: 'Aunque tiene el cuello extremadamente largo, ¿cuántas vértebras cervicales tiene una jirafa, exactamente las mismas que un ser humano?', answer: 'Siete' },
        { text: '¿Qué animal marino gigante tiene una lengua que puede llegar a pesar tanto como un elefante adulto?', answer: 'La ballena azul' },
        { text: '¿Qué animal emite vocalizaciones que suenan de forma muy parecida a una carcajada humana?', answer: 'La hiena' },
        { text: '¿Qué animal es famoso por fingir estar muerto de manera muy realista cuando se siente amenazado?', answer: 'La zarigüeya' },
        { text: '¿Qué animal marino utiliza piedras como herramientas para golpear y abrir las conchas de los mariscos de los que se alimenta?', answer: 'La nutria marina' },
        { text: '¿Qué insecto pequeño es capaz de saltar una distancia que equivale a más de 100 veces la longitud de su propio cuerpo?', answer: 'La pulga' },
        { text: '¿Qué ave marina es famosa por tener una enorme bolsa de piel bajo el pico que usa como red para pescar?', answer: 'El pelícano' },
        { text: '¿Qué animal se alimenta exclusivamente de hojas de eucalipto, las cuales son altamente tóxicas para la gran mayoría de especies?', answer: 'El koala' },
        { text: '¿Qué animal herbívoro de la sabana tiene un patrón de rayas blancas y negras que es único en cada individuo, como una huella dactilar?', answer: 'La cebra' },
        { text: '¿Qué ave no voladora de gran tamaño, originaria de Australia, es considerada la segunda más grande del mundo actual?', answer: 'El emú' },
        { text: '¿Qué animal nocturno tiene la capacidad física de girar su cabeza casi 270 grados en ambas direcciones?', answer: 'El búho' },
        { text: '¿Qué animal doméstico pasa durmiendo entre 12 y 16 horas al día y tiene la habilidad de caer casi siempre sobre sus patas?', answer: 'El gato' },
        { text: '¿Qué animal acuático construye nidos de barro con forma de pequeña copa pegados a las paredes de los edificios o puentes?', answer: 'La golondrina' },
        { text: '¿Qué insecto social vive en colonias subterráneas gigantescas y coopera estrechamente bajo las órdenes de una reina?', answer: 'La hormiga' },
        { text: '¿Qué animal terrestre utiliza una larga trompa (que es la fusión de su nariz y labio superior) para beber, respirar y agarrar objetos?', answer: 'El elefante' },
        { text: '¿Qué animal marino viaja en grandes grupos llamados manadas o flotas y es famoso por dar saltos acrobáticos fuera del agua?', answer: 'El delfín' },
        { text: '¿Qué animal de caparazón duro se encierra completamente dentro de él metiendo la cabeza y las patas cuando percibe peligro?', answer: 'La tortuga' },
        { text: '¿Qué animal cánido salvaje vive en manadas muy estructuradas y es conocido por aullar en las noches?', answer: 'El lobo' },
        { text: '¿Qué ave acuática pasa la mayor parte de su vida en el agua fría del hemisferio sur y utiliza sus alas como aletas para nadar en lugar de volar?', answer: 'El pingüino' },
        { text: '¿Qué animal pasa gran parte del día sumergido en el lodo de los ríos y charcos para proteger su piel del calor y los insectos?', answer: 'El búfalo de agua' },
        { text: '¿Qué marsupial australiano lleva a sus crías recién nacidas dentro de una bolsa ventral hasta que crecen lo suficiente?', answer: 'El canguro' },
        { text: '¿Qué mariposa realiza una de las migraciones más largas del mundo volando miles de kilómetros entre Canadá y México?', answer: 'La mariposa Monarca' },
        { text: '¿Qué animal es considerado el rey de la selva debido a su imponente melena y su rugido que se escucha a kilómetros de distancia?', answer: 'El león' },
        { text: '¿Qué animal marino de cuerpo blando y alargado se desplaza expulsando agua a presión como si fuera un cohete?', answer: 'El calamar' },
        { text: '¿Cuáles son los nombres de las tres estrellas principales que forman el Cinturón de Orión?', answer: 'Alnitak, Alnilam y Mintaka' },
        { text: '¿Cuál es la galaxia espiral más cercana a la Vía Láctea?', answer: 'Andrómeda' },
        { text: '¿Qué planeta del sistema solar tiene los vientos más rápidos, superando los 2.000 km/h?', answer: 'Neptuno' },
        { text: '¿Cómo se llama el límite teórico alrededor de un agujero negro del cual nada, ni siquiera la luz, puede escapar?', answer: 'Horizonte de sucesos' },
        { text: '¿Qué nombre recibe la inmensa nube esférica de cometas y cuerpos helados que envuelve los límites del sistema solar?', answer: 'Nube de Oort' },
        { text: '¿Cuál es la estrella más brillante del cielo nocturno vista desde la Tierra?', answer: 'Sirio' },
        { text: '¿Qué planeta del sistema solar tiene un eje de rotación tan inclinado que parece girar "de lado" respecto a su órbita?', answer: 'Urano' },
        { text: '¿Cuál es la luna más grande de todo el sistema solar, que incluso supera en tamaño al planeta Mercurio?', answer: 'Ganímedes (luna de Júpiter)' },
        { text: '¿Cómo se llama el remanente denso que queda después de que una estrella de tamaño medio, como nuestro Sol, agota su combustible nuclear?', answer: 'Enana blanca' },
        { text: '¿Qué efecto óptico describe el cambio en la longitud de onda de la luz hacia el extremo rojo del espectro provocado por una galaxia que se aleja?', answer: 'Corrimiento al rojo (o Efecto Doppler)' },
        { text: '¿Cuál es el nombre del primer exoplaneta descubierto orbitando una estrella de secuencia principal similar al Sol?', answer: '51 Pegasi b' },
        { text: '¿Qué sonda espacial es actualmente el objeto fabricado por el ser humano que se encuentra más alejado de la Tierra?', answer: 'Voyager 1' },
        { text: '¿Cuál es el volcán más grande de todo el sistema solar, ubicado en la superficie de Marte?', answer: 'Monte Olimpo (Olympus Mons)' },
        { text: '¿Qué elemento químico es el más primitivo y abundante en todo el universo?', answer: 'Hidrógeno' },
        { text: '¿Cómo se llama el punto exacto en la órbita de un planeta u objeto celeste cuando se encuentra más cerca del Sol?', answer: 'Perihelio' },
        { text: '¿Qué término astrofísico describe la cantidad total de energía que emite una estrella en todas direcciones por unidad de tiempo?', answer: 'Luminosidad' },
        { text: '¿Cuál es la estrella conocida más cercana a la Tierra después del Sol?', answer: 'Próxima Centauri' },
        { text: '¿Qué famoso diagrama clasifica a las estrellas según su temperatura superficial y su luminosidad absoluta?', answer: 'Diagrama de Hertzsprung-Russell (o Diagrama H-R)' },
        { text: '¿Qué fuerza fundamental del universo es la principal responsable de la formación de galaxias, estrellas y sistemas planetarios?', answer: 'Gravedad' },
        { text: '¿Qué nombre recibe el hipotético tipo de materia que no emite ni interactúa con la luz, pero de la cual se deduce su existencia por su enorme influencia gravitacional?', answer: 'Materia oscura' },
        { text: '¿Cómo se llama el evento cataclísmico en el que una estrella supermasiva colapsa sobre sí misma y explota?', answer: 'Supernova' },
        { text: '¿Qué forma morfológica específica tiene nuestra galaxia, la Vía Láctea?', answer: 'Espiral barrada' },
        { text: '¿Cuál es el único planeta del sistema solar que no lleva el nombre de una deidad de la mitología grecorromana?', answer: 'La Tierra' },
        { text: '¿Qué satélite natural de Saturno posee una atmósfera densa y lagos superficiales de metano líquido?', answer: 'Titán' },
        { text: '¿Qué famosa lluvia de meteoros, visible en octubre, está directamente asociada con los restos que deja el cometa Halley?', answer: 'Oriónidas' },
        { text: '¿Cómo se llama la frontera espacial donde el viento solar pierde su fuerza y choca con el medio interestelar?', answer: 'Heliopausa' },
        { text: '¿Cuál es el objeto estelar más denso que se conoce en el universo, justo un paso antes de convertirse en un agujero negro?', answer: 'Estrella de neutrones' },
        { text: '¿Qué unidad de medida astronómica de distancia equivale aproximadamente a 3,26 años luz?', answer: 'Pársec' },
        { text: '¿Qué planeta enano es el objeto más grande situado en el cinturón de asteroides principal entre Marte y Júpiter?', answer: 'Ceres' },
        { text: '¿Cómo se llama el fenómeno predicho por Einstein donde la inmensa gravedad de una galaxia curva la luz de un objeto situado detrás de ella?', answer: 'Lente gravitacional' },
        { text: '¿Qué nombre recibe el "eco" de radiación remanente del Big Bang que llena uniformemente todo el universo observable?', answer: 'Fondo Cósmico de Microondas' },
        { text: '¿Qué luna helada de Júpiter es considerada uno de los lugares más prometedores para buscar vida por tener un océano de agua líquida bajo su superficie?', answer: 'Europa' },
        { text: '¿Cuál es la constelación más grande en área de todo el cielo nocturno?', answer: 'Hidra' },
        { text: '¿Qué fenómeno astronómico ocurre cuando la Luna pasa directamente por la sombra proyectada por la Tierra?', answer: 'Eclipse lunar' },
        { text: '¿Qué telescopio espacial, lanzado a finales de 2021, fue diseñado principalmente para observar el universo primigenio en luz infrarroja?', answer: 'Telescopio Espacial James Webb' },
        { text: '¿Qué energía teórica e invisible se cree que es la responsable de que la expansión del universo se esté acelerando?', answer: 'Energía oscura' },
        { text: '¿Cómo se llama la estrella que actualmente marca el norte celeste en el hemisferio norte debido a su posición alineada con el eje terrestre?', answer: 'Polaris (Estrella Polar)' },
        { text: '¿Qué tipo de galaxia se caracteriza por carecer de estructura espiral, tener forma de globo y estar compuesta principalmente por estrellas muy viejas?', answer: 'Galaxia elíptica' },
        { text: '¿Qué ley de la física cosmológica establece que la velocidad a la que se aleja una galaxia es directamente proporcional a su distancia de nosotros?', answer: 'Ley de Hubble' },
        { text: '¿Cuál es el cuerpo celeste volcánicamente más activo de todo el sistema solar?', answer: 'Ío (luna de Júpiter)' },
        { text: '¿Qué nombre genérico reciben las gigantescas nubes de gas y polvo interestelar donde se forman las nuevas estrellas?', answer: 'Nebulosas' },
        { text: '¿En qué brazo espiral específico de la Vía Láctea se encuentra ubicado nuestro sistema solar?', answer: 'Brazo de Orión (o Espolón de Orión)' },
        { text: '¿Cómo se llama la región en forma de disco del sistema solar, situada más allá de la órbita de Neptuno, donde habitan Plutón y otros cuerpos helados?', answer: 'Cinturón de Kuiper' },
        { text: '¿Qué planeta es famoso por tener el cañón más grande y profundo del sistema solar, llamado Valles Marineris?', answer: 'Marte' },
        { text: '¿Cuál es el nombre de la estrella supergigante roja que marca el hombro derecho de la constelación de Orión y que podría estallar en supernova en el futuro?', answer: 'Betelgeuse' },
        { text: '¿Qué fenómeno estelar ocurre cuando una estrella de neutrones gira rápidamente emitiendo haces periódicos de radiación electromagnética como un faro?', answer: 'Púlsar' },
        { text: '¿Cómo se denomina al espacio inmenso, casi vacío de materia, que existe entre las distintas galaxias del universo?', answer: 'Medio intergaláctico' },
        { text: '¿Qué astrónomo renacentista propuso el primer modelo matemático heliocéntrico, afirmando que el Sol y no la Tierra era el centro del sistema?', answer: 'Nicolás Copérnico' },
        { text: '¿Qué tipo de objeto astronómico de millones de masas solares se encuentra en el centro gravitacional de casi todas las grandes galaxias?', answer: 'Agujero negro supermasivo' },
        { text: '¿Cuál es la temperatura aproximada que alcanza el núcleo del Sol donde se produce la fusión nuclear?', answer: '15 millones de grados Celsius' },

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Mezcla normal + fútbol + disco. Fútbol solo entra si el modo está activo.
  // Disco nunca queda del todo fuera: si el modo está apagado igual se cuela
  // en poca medida; si está prendido, domina pero deja pasar algunas normales.
  // Cada entrada puede ser un string simple o un objeto { text, answer }
  // para las preguntas que tienen una respuesta que se puede revelar.
  function toEntry(item){
    return (typeof item === 'string') ? { text: item, answer: null } : item;
  }

  function identityOf(item){
    if (typeof item === 'string') return item;
    if (item.text !== undefined) return item.text;
    if (item.name !== undefined) return item.name;
    return JSON.stringify(item);
  }

  // Elige sin repetir hasta agotar el mazo de esa categoría/lista: guarda lo
  // ya salido en state.history[key], y cuando ya no queda nada nuevo, reinicia
  // el mazo. Así no se repite lo mismo dos veces seguidas dentro de una misma
  // categoría ni entre los juegos.
  function pickWithHistory(historyKey, weightedEntries){
    var used = state.history[historyKey] || (state.history[historyKey] = []);
    var avail = weightedEntries.filter(function(e){ return used.indexOf(identityOf(e.item)) === -1; });
    if (avail.length === 0){ used.length = 0; avail = weightedEntries; }
    var total = avail.reduce(function(sum, e){ return sum + e.w; }, 0);
    var r = Math.random() * total;
    var picked = avail[avail.length - 1].item;
    for (var i = 0; i < avail.length; i++){
      r -= avail[i].w;
      if (r <= 0){ picked = avail[i].item; break; }
    }
    used.push(identityOf(picked));
    return picked;
  }

  function weightedPick(catKey, cat){
    var entries = [];
    cat.items.forEach(function(it){ entries.push({ item: toEntry(it), w: (it && typeof it === 'object' && it.weight) || 1 }); });
    if (state.futbol && cat.futbol){
      cat.futbol.forEach(function(it){ entries.push({ item: toEntry(it), w: 1 }); });
    }
    if (cat.disco){
      var discoWeight = state.disco ? 3 : 0.2;
      cat.disco.forEach(function(it){ entries.push({ item: toEntry(it), w: discoWeight }); });
    }
    if (state.modoAmigos && cat.amigos){
      cat.amigos.forEach(function(it){ entries.push({ item: toEntry(it), w: 2 }); });
    }
    if (state.modoHistoria && cat.historia){
      cat.historia.forEach(function(it){ entries.push({ item: toEntry(it), w: 2 }); });
    }
    return pickWithHistory(catKey, entries);
  }

  // Selección al azar ponderada genérica: cada elemento de arr pesa lo que
  // devuelva weightFn (por defecto 1), así "Evento aleatorio" puede salir
  // mucho más seguido que el resto de los juegos.
  function weightedChoice(arr, weightFn){
    var total = arr.reduce(function(sum, it){ return sum + weightFn(it); }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < arr.length; i++){
      r -= weightFn(arr[i]);
      if (r <= 0) return arr[i];
    }
    return arr[arr.length - 1];
  }

  function makeCard(fields){
    return Object.assign({ cat:null, icon:null, text:null, sub:null, answer:null, isSpy:false, special:null, rounds:null, topics:null, image:null }, fields);
  }

  // El tope de state.drinkConfig.maxDrinks es el techo absoluto de la app —
  // el x2 de modo disco nunca lo pasa, solo acerca los números chicos a ese
  // techo. Todo esto se puede ajustar desde Ajustes > Configurador de tragos.
  function discoDouble(n){ return state.disco ? Math.min(n * 2, state.drinkConfig.maxDrinks) : n; }

  // Elige un número al azar entre min y max, dando menos probabilidad a los
  // números más altos (peso decreciente) — usado por Evento aleatorio y
  // Nunca nunca, cada uno con su propio rango configurable.
  function weightedRandomInRange(min, max){
    if (max <= min) return min;
    var span = max - min + 1;
    var total = 0, i;
    for (i = 0; i < span; i++) total += (span - i);
    var r = Math.random() * total;
    for (i = 0; i < span; i++){
      r -= (span - i);
      if (r <= 0) return min + i;
    }
    return min;
  }

  function randomDrinkCount(){
    return discoDouble(weightedRandomInRange(state.drinkConfig.eventMin, state.drinkConfig.eventMax));
  }

  // Dobla el número inicial de "N trago(s) por cada ..." cuando el modo
  // disco está activo (no toca ningún otro número dentro del texto, como
  // años o cantidades de respuestas de trivia), siempre respetando el tope.
  function applyDiscoDrinks(text){
    if (!state.disco) return text;
    return text.replace(/^(\d+)(\s*tragos?\s+por\s+cada)/i, function(m, num, rest){
      return discoDouble(parseInt(num, 10)) + rest;
    });
  }

  // Nunca nunca no traía tragos definidos — al azar dentro de su rango
  // configurable (x2 en disco, con el mismo tope que el resto de la app).
  function randomNuncaDrinks(){
    return discoDouble(weightedRandomInRange(state.drinkConfig.nuncaMin, state.drinkConfig.nuncaMax));
  }

  function resolveEvent(template){
    var turnPlayer = state.players[state.turn];
    var p1 = state.players[Math.floor(Math.random() * state.players.length)];
    var others = state.players.filter(function(p){ return p !== p1; });
    var p2 = others.length ? others[Math.floor(Math.random() * others.length)] : p1;
    return applyDiscoDrinks(template
      .replace(/\{jugador1\}/g, p1.name)
      .replace(/\{jugador2\}/g, p2.name)
      .replace(/\{jugador\}/g, turnPlayer.name)
      .replace(/\bX\b/g, function(){ return String(randomDrinkCount()); }));
  }

  // Timer real de 5 minutos para la carta TIMEOUT. En iOS Safari no existe
  // la API de Notification, así que el aviso confiable es el banner en
  // pantalla; la notificación del sistema es un plus best-effort donde sí
  // esté disponible (Android/desktop).
  function scheduleTimeoutAlarm(){
    if (typeof Notification !== 'undefined' && Notification.permission === 'default'){
      try { Notification.requestPermission(); } catch (e){}
    }
    setTimeout(function(){
      var banner = document.createElement('div');
      banner.className = 'timeout-banner';
      banner.innerHTML = '<span>⏱️ ¡TIMEOUT! Vasos vacíos</span>';
      var closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.setAttribute('aria-label', 'Cerrar aviso');
      closeBtn.textContent = '✕';
      closeBtn.addEventListener('click', function(){ banner.remove(); });
      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted'){
        try { new Notification('¡TIMEOUT!', { body: 'Se acabaron los 5 minutos — vasos vacíos' }); } catch (e){}
      }
    }, 5 * 60 * 1000);
  }

  function drawChallenge(){
    var sp = state.specials;

    // Modo Cultura No General: solo cultura, sin eventos especiales, sin saludo
    // Modo Cultura No General: solo cultura, sin eventos especiales, sin saludo
    if (state.selectedMode === 'cultura'){
      var cat = DECK.cultura;
      var entry = (state.modoPapu && cat.papu && cat.papu.length > 0) 
        ? weightedPick('papu', { items: cat.papu }) 
        : weightedPick('cultura', cat);
      var cardText = entry.text;
      state.card = makeCard({ cat: 'cultura', icon: cat.icon, text: cardText, answer: entry.answer || null, special: entry.special || null, rounds: entry.rounds || null, topics: entry.topics || null, image: entry.image || null });
      return;
    }

    if (!sp.greetingShown){
      sp.greetingShown = true;
      state.card = makeCard({ cat: 'evento', icon: '🥂', text: 'Para empezar, todos ' + discoDouble(state.drinkConfig.greeting) + ' tragos', special: 'greeting' });
      return;
    }

    sp.cardsDrawn++;

    if (sp.reyKCount < 4 && sp.cardsDrawn >= sp.reyKNextEligible && Math.random() < 0.25){
      sp.reyKCount++;
      sp.reyKNextEligible = sp.cardsDrawn + 20;
      state.card = buildReyKCard(sp.reyKCount);
      return;
    }

    var opusCfg = SPECIAL_EVENTS.opus;
    if (!sp.opusShown && sp.cardsDrawn >= opusCfg.minCard && Math.random() < opusCfg.chance){
      sp.opusShown = true;
      state.card = makeCard({ cat: 'evento', icon: '💿', text: 'OPUS', special: 'opus' });
      return;
    }

    var espCfg = SPECIAL_EVENTS.espejito;
    if (!sp.espejitoShown && sp.cardsDrawn >= espCfg.minCard && Math.random() < espCfg.chance){
      sp.espejitoShown = true;
      state.card = makeCard({ cat: 'evento', icon: '🪞', text: 'Espejito rebotín', sub: 'La próxima vez que te toque tomar puedes desviar los tragos a alguien más.', special: 'espejito' });
      return;
    }

    var toCfg = SPECIAL_EVENTS.timeout;
    if (!sp.timeoutShown && sp.cardsDrawn >= toCfg.minCard && Math.random() < toCfg.chance){
      sp.timeoutShown = true;
      state.card = makeCard({ cat: 'evento', icon: '⏱️', text: 'TIMEOUT', sub: 'En 5 minutos todos sus vasos deben estar vacíos', special: 'timeout' });
      scheduleTimeoutAlarm();
      return;
    }

    var bkCfg = SPECIAL_EVENTS.booker;
    if (!sp.bookerShown && state.disco && sp.cardsDrawn >= bkCfg.minCard && Math.random() < bkCfg.chance){
      sp.bookerShown = true;
      state.card = makeCard({ cat: 'evento', icon: '🔥', text: 'BOOKER T', special: 'booker' });
      return;
    }

    var cascCfg = SPECIAL_EVENTS.cascada;
    if (state.disco && sp.cardsDrawn >= sp.nextCascada){
      sp.nextCascada = sp.cardsDrawn + cascCfg.every;
      state.card = makeCard({ cat: 'evento', icon: '🌊', text: 'Cascada', sub: 'Todos toman en cadena: nadie para hasta que pare la persona a su derecha, y así hasta dar toda la vuelta', special: 'cascada' });
      return;
    }

    var keys = activeCategoryKeys();
    // No repetir la misma categoría dos veces seguidas.
    var candidateKeys = keys.filter(function(k){ return k !== state.lastCategory; });
    if (candidateKeys.length === 0) candidateKeys = keys;
    var catKey = weightedChoice(candidateKeys, function(k){ return CATEGORY_WEIGHT[k] || 1; });
    state.lastCategory = catKey;
    var cat = DECK[catKey];

    if (catKey === 'evento'){
      var eventEntry = weightedPick(catKey, cat);
      var eventText = resolveEvent(eventEntry.text);
      state.card = makeCard({ cat: catKey, icon: cat.icon, text: eventText });
      return;
    }

    if (catKey === 'juegos'){
      var pool = cat.items.filter(function(g){ return !g.needsCards || state.cards === 'si'; });
      var gameEntries = pool.map(function(g){ return { item: g, w: 1 }; });
      var game = pickWithHistory('juegos', gameEntries);
      var gameTopic = (game.topics && game.topics.length) ? game.topics[Math.floor(Math.random() * game.topics.length)] : null;
      state.card = makeCard({ cat: catKey, icon: game.icon, text: game.name, sub: game.rules, isSpy: game.name === 'Impostor', topic: gameTopic });
      return;
    }

    var entry = weightedPick(catKey, cat);
    var cardText = applyDiscoDrinks(entry.text);
    if (catKey === 'nunca') cardText += ' — el que lo haya hecho toma ' + randomNuncaDrinks();
    state.card = makeCard({ cat: catKey, icon: cat.icon, text: cardText, answer: entry.answer || null, special: entry.special || null, rounds: entry.rounds || null, topics: entry.topics || null, image: entry.image || null });
  }

  // Los paréntesis en ESPIA_WORDS son comandos, no texto literal:
  // "(Uno de los jugadores al azar)" -> la palabra completa pasa a ser un jugador al azar.
  // "(jugador aleatorio)" dentro de la frase -> se reemplaza por un nombre al azar ahí mismo.
  function resolveEspiaWord(template){
    if (template === '(Uno de los jugadores al azar)'){
      var p = state.players[Math.floor(Math.random() * state.players.length)];
      return p.name;
    }
    if (template.indexOf('(jugador aleatorio)') !== -1){
      var p2 = state.players[Math.floor(Math.random() * state.players.length)];
      return template.replace(/\(jugador aleatorio\)/g, p2.name);
    }
    return template;
  }

  function startEspia(){
    var pool = ESPIA_WORDS.normal.slice();
    if (state.futbol) pool = pool.concat(ESPIA_WORDS.futbol);
    if (state.modoAmigos && ESPIA_WORDS.amigos) pool = pool.concat(ESPIA_WORDS.amigos);
    var template = pool[Math.floor(Math.random() * pool.length)];
    var word = resolveEspiaWord(template);

    var order = shuffle(state.players.map(function(_, i){ return i; }));

    // 5% de las veces, todos son el Impostor (ronda especial, sin palabra real).
    // Con más de 6 jugadores, hay 2 Impostores en vez de 1.
    // El/los Impostor(es) se eligen con un sorteo aparte del orden de paso
    // de teléfono — si no, siempre salía el mismo que el primero en ver la
    // tarjeta, porque compartían el mismo shuffle.
    var allImpostors = Math.random() < 0.05;
    var spyIndexes;
    if (allImpostors){
      spyIndexes = order.slice();
    } else {
      var impostorCount = Math.min(state.players.length > 6 ? 2 : 1, order.length);
      spyIndexes = shuffle(state.players.map(function(_, i){ return i; })).slice(0, impostorCount);
    }

    state.espia = { word: word, spyIndexes: spyIndexes, allImpostors: allImpostors, order: order, step: 0, revealed: false };
  }

  // Mini-juego "1 trago por cada" en modo disco: cuenta regresiva de 3s y
  // luego palabras al azar cayendo una por una cada 5s, en rondas separadas
  // (Lugares primero, Personas después), 5 de cada ronda.
  function startWordDrop(){
    var words = [];
    state.card.rounds.forEach(function(round){
      var picked = shuffle(round.words).slice(0, Math.min(5, round.words.length));
      picked.forEach(function(w){
        var entry = (typeof w === 'string') ? { text: w, double: false } : w;
        words.push({ round: round.label, word: entry.text, double: !!entry.double });
      });
    });
    state.wordDrop = { phase: 'countdown', countdown: 3, words: words, index: -1 };
    render();
    tickCountdown();
  }

  function tickCountdown(){
    setTimeout(function(){
      var wd = state.wordDrop;
      if (!wd || wd.phase !== 'countdown') return;
      wd.countdown -= 1;
      if (wd.countdown <= 0){
        wd.phase = 'playing';
        wd.index = 0;
        render();
        scheduleNextWord();
      } else {
        render();
        tickCountdown();
      }
    }, 1000);
  }

  function scheduleNextWord(){
    setTimeout(function(){
      var wd = state.wordDrop;
      if (!wd || wd.phase !== 'playing') return;
      if (wd.index >= wd.words.length - 1){
        wd.phase = 'done';
        render();
      } else {
        wd.index += 1;
        render();
        scheduleNextWord();
      }
    }, 5000);
  }

  // Desafío "1 trago por cada ___ que pueda nombrar": elige un tema al azar
  // y corre un cronómetro de 30 segundos.
  function startNamingChallenge(){
    var topic = state.card.topics[Math.floor(Math.random() * state.card.topics.length)];
    state.naming = { topic: topic, seconds: 30, phase: 'running' };
    render();
    tickNaming();
  }

  function tickNaming(){
    setTimeout(function(){
      var n = state.naming;
      if (!n || n.phase !== 'running') return;
      n.seconds -= 1;
      if (n.seconds <= 0){
        n.phase = 'done';
        render();
      } else {
        render();
        tickNaming();
      }
    }, 1000);
  }
var roscoTimerInterval = null;

  function startRoscoTimer() {
    if (roscoTimerInterval) clearInterval(roscoTimerInterval);
    state.roscos[state.turn].active = true;
    roscoTimerInterval = setInterval(function(){
      if (!state.roscos[state.turn].active) return;
      state.playerTimers[state.turn]--;
      
      if (state.playerTimers[state.turn] <= 0){
        state.playerTimers[state.turn] = 0;
        nextRoscoPlayer();
      } else {
        var timerElement = document.querySelector('.rosco-timer');
        if (timerElement) {
          timerElement.textContent = state.playerTimers[state.turn] + 's';
        } else {
          render();
        }
      }
    }, 1000);
  }

  function stopRoscoTimer() {
    state.roscos[state.turn].active = false;
    if (roscoTimerInterval) clearInterval(roscoTimerInterval);
  }

  function advanceRoscoIndex() {
    var r = state.roscos[state.turn];
    var startIdx = r.currentIndex;
    for (var i = 1; i <= r.questions.length; i++) {
      var idx = (startIdx + i) % r.questions.length;
      if (r.questions[idx].status === 'pending') {
        r.currentIndex = idx;
        return true;
      }
    }
    return false; 
  }

  function checkRoscoEnd() {
    var r = state.roscos[state.turn];
    var pending = r.questions.filter(function(q){ return q.status === 'pending'; }).length;
    if (pending === 0) {
      stopRoscoTimer();
      r.finished = true;
      return true;
    }
    return false;
  }

  function nextRoscoPlayer() {
    stopRoscoTimer();
    // Avanzar a la siguiente letra de ESTE jugador antes de soltar el turno
    advanceRoscoIndex(); 
    
    // Buscar al siguiente jugador que aún no haya terminado
    var attempts = 0;
    do {
      state.turn = (state.turn + 1) % state.players.length;
      attempts++;
    } while (state.roscos[state.turn].finished && attempts < state.players.length);

    render();
  }
